[project]
name = "hwflow"
version = "0.1.0"
description = "Text-to-KiCad flow for ZoneFlow hardware: schematic generator, board builder, fab outputs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
# PyYAML is for the schematic half only: a circuit description reads
# hardware/netlist.yaml under `uv run`. The board steps run under the system
# interpreter that carries KiCad's pcbnew module, which cannot install
# wheels, so no hwflow module that they import may need a third-party package.
dependencies = ["pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hwflow"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
