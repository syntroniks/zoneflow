[project]
name = "zfflash"
version = "0.1.0"
description = "Flash, update, factory-reset, back up and restore a ZoneFlow controller without a Chromium browser"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # Writes the flash. The same version builds the release's factory image.
    "esptool==5.6.0",
    # Port listing (esptool already depends on it; named here because we import it).
    "pyserial>=3.5,<4",
]

[project.scripts]
zfflash = "zfflash.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zfflash"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
