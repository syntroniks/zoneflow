standard_max_qty = 80000
economic_setup = 8.18
economic_stencil = 1.53
economic_joint = 0.0016         # 1-100,000 joints
economic_feeder_extended = 3.07 # per extended part type; preferred extended exempt (see below)
standard_setup_single = 25.56
standard_stencil_single = 8.21
# Standard SMT joint price: [upper joint count of the tier, USD per joint].
standard_joint_tiers = [[50000, 0.0016], [100000, 0.0013], [1000000, 0.0012]]
standard_feeder_per_type = 1.53 # basic and extended
