# Sourced facts for the landed-cost estimate. Every value here was read from
# the source named next to it, on the date given. Nothing here is a guess:
# guesses are in assumptions.toml. Prices are USD.
#
# Per-part JLCPCB data (stock, price breaks, basic/extended, minimum and
# attrition quantities) is in jlcpcb-parts.csv, fetched on 2026-11-11.

snapshot_date = "2026-11-11"

# --- The board, from the layout on branch hw/rev-a-layout (pull request #39) ---
[board]
source = "hardware/zoneflow-a/output on branch hw/rev-a-layout at 7ec8e75 (PR #39): build-summary.json, the JLCPCB BOM and placement files, zoneflow-a.kicad_pcb; docs/design/hardware-layout.md sections 2 and 12"
date_checked = "2026-11-11"
width_mm = 114
height_mm = 110
layers = 4
thickness_mm = 1.6
outer_copper_oz = 1
inner_copper_oz = 0.5
smallest_hole_mm = 0.2
footprints = 351
# Parts in the placement file (SMT, top side only), per build: 307 and 262.
# Added to both here: the five SMT parts of the 3V3 over-voltage detector
# (U13, R13, R100, C55, C56; hardware design section 9.5), which are in
# hardware/netlist.yaml and not yet in that layout.
placements = { "8-zone" = 312, "4-zone" = 267 }
# Distinct soldered pins of the placed parts, counted from the pads of each
# placed footprint in zoneflow-a.kicad_pcb (a pin with several pads, such as
# the module's ground pad and its via pads, counts once): 836 and 726. Plus
# 14 for the five parts above: six for U13 and two for each of the others.
smt_joints = { "8-zone" = 850, "4-zone" = 740 }
# Through-hole parts left out of the placement file. C1 and K1 sit on the
# bottom side and are soldered from the top; the four headers are on top.
tht_refs = ["J1", "J2", "J3", "J4", "C1", "K1"]
tht_joints = { J1 = 2, J2 = 7, J3 = 4, J4 = 7, C1 = 2, K1 = 4 }
# Plugged in at final assembly, not soldered.
plugged_refs = ["DS1"]

# --- PCB fabrication, JLCPCB online quote ---
# cart.jlcpcb.com/quote, no login. FR-4 TG135 default material, 4 layers,
# 114 x 110 mm, 1.6 mm, 1 oz outer / 0.5 oz inner, green, lead-free HASL,
# single PCB, default build time for the quantity. The calculator returned
# the same price for HASL with lead, lead-free HASL and ENIG.
[pcb_fab]
source = "JLCPCB online quote calculator, cart.jlcpcb.com/quote (calculationGoodsCostsNew), no login"
date_checked = "2026-11-11"
# Board price per order (engineering fee + board + test + other), USD, by the
# quantity of boards ordered. "via_0p3": smallest hole 0.3 mm, the default.
# "via_0p2": smallest hole 0.2 mm, which this layout needs (twelve thermal
# vias under U1); selecting it also selects TG155 material and the 4-wire
# Kelvin test, and the calculator adds those charges.
quantities = [5, 10, 20, 25, 30, 50, 75, 100, 150, 200]
via_0p3 = [32.80, 40.50, 56.00, 63.70, 71.40, 102.40, 131.50, 165.40, 233.40, 301.20]
via_0p2 = [71.89, 82.28, 103.17, 113.57, 123.98, 165.76, 208.35, 255.73, 350.68, 445.45]
# Shipping weight the calculator gives for 5 bare boards: 210 g of boards,
# 336 g with packing.
bare_board_g = 42.0

# --- Shipping to the US, same calculator (calculateGoodsFreight) ---
[freight_us]
source = "JLCPCB online quote calculator, calculateGoodsFreight, destination US, UPS Express Saver (DDP)"
date_checked = "2026-11-11"
service = "UPS Express Saver (DDP), 2-4 business days"
weight_g = [336, 500, 1000, 2000, 3000, 5000, 8000, 10000, 15000]
usd = [26.60, 26.60, 31.69, 43.19, 45.70, 67.64, 99.31, 117.40, 155.77]

