[project]
name = "zfrelease"
version = "0.1.0"
description = "Release packaging and verification for ZoneFlow firmware: factory image, OTA image, checksums, ESP Web Tools manifest"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    # merge-bin builds the factory image. Pinned: the output format is part of the release.
    "esptool==5.6.0",
    # Checks manifests against schemas/esp-web-tools-manifest.schema.json.
    "jsonschema>=4.23,<5",
]

[project.scripts]
zfrelease = "zfrelease.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zfrelease"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
