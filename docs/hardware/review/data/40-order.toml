title = "Placement preview: every other polarised part against the pin 1 table"
source = "Layout review, section 17, item 5, and section 5, \"What this does not prove\""
findings = ["L1", "L23"]
minutes = 12
files = ["hardware/rules/jlcpcb-cpl-rotations.csv"]
remedies = [
  { id = "fix-rotation", text = "Add or correct the row for this part number in `hardware/rules/jlcpcb-cpl-rotations.csv`, then run `make cpl-check`." },
]
check = '''
With the pin 1 table beside the preview, go through the remaining polarised parts: the other
diodes, the ICs, the three resistor arrays and the two small connectors. Then scroll once over the
whole board for any part beside its lands.
'''
why = '''
The placement check proves that the files agree with the footprints in JLCPCB's library. It cannot
prove that the library draws each part the way it lies in its tape. JLCPCB's preview is drawn from
the same library, so it shares that limit. What it adds is JLCPCB's own reading of your files, and
their engineers look at the same picture. For the 26 part types where direction matters, the
library names its pins or numbers them as the maker does. D25 is the exception.
'''
good = '''
- **Each part in the table** has its pad 1 where the table's last column says: "left", "upper
  left" and so on, seen from above.
- **Diodes:** pad 1 is the cathode.
- **The six BAT54S** are judged by their pads, not by the symbol JLCPCB shows.
- **No part** lies beside its lands or across them.
'''
bad = '''
- **A part whose mark disagrees with the table.** Note the designator. Do not correct it in the
  preview only: the correction belongs in `hardware/rules/jlcpcb-cpl-rotations.csv`, so that the
  next order is right too.
'''
how = '''
The table is [`zoneflow-a-pin1.csv`](out:zoneflow-a-pin1.csv), 85 parts. The
[bench sheet](doc:hardware/review/bench-sheet.md) prints it. Parts already covered by the steps
before this one: D25, the LEDs, the triacs, the opto-triacs, U4, J7 and BT1.
'''
cannot = '''
**Tape orientation cannot be shown or checked from files.** How a part lies in its tape is a
property of the reel JLCPCB loads. No picture here and no preview there shows it. The first
assembled board does: before you power it, compare every polarised part on it with the top
assembly drawing. The bring-up plan begins with an inspection before power. Do it then.
'''

[[step.figure]]
id = "top"
alt = "The whole top side as part outlines with designators"
caption = "The top assembly drawing, for finding parts by designator while you go through the table. Click to enlarge."
asset = "assembly-top.svg"

