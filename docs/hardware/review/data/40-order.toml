[[step]]
id = "o-layers"
group = "order"
title = "The four copper layers in the right order"
source = "Layout review, section 11, \"Job file, L12\""
findings = ["L12"]
minutes = 4
remedies = [
  { id = "state-order", text = "Write the layer order on the ordering page, as text for the remark field of the order." },
]
check = '''
In JLCPCB's Gerber viewer, confirm that the two inner layers are in the right order: the ground
plane directly under the top side, the 3.3 V plane directly above the bottom side.
'''
why = '''
The USB pair, the display bus and the keep-alive net run on the bottom layer over the 3.3 V plane.
The buck converter sits on the top layer over the ground plane. If the fab swaps the two inner
layers, every via still connects and the board passes electrical test, but the planes are on the
wrong side of the signals they serve.
'''
good = '''
- **Inner layer 1,** the one next to the top, is `zoneflow-a-In1_Cu.gbr`. It is one sheet of copper
  with holes in it and no track.
- **Inner layer 2** is `zoneflow-a-In2_Cu.gbr`. It has the large plane on top and, towards the
  terminals, a separate rectangle and nine stepped lanes.
'''
bad = '''
- **The layer with the nine lanes shown as inner layer 1.**
- **Only two copper layers recognised.**
'''
how = '''
The file names carry KiCad's layer names. If the viewer lists the layers, check that the order is
F_Cu, In1_Cu, In2_Cu, B_Cu. If it asks you to assign them, assign them so.
'''
cannot = '''
I cannot show JLCPCB's viewer. The two pictures are the two inner layers drawn from the board file,
so that you can tell them apart in any viewer.
'''

[[step.figure]]
id = "in1"
alt = "Inner layer 1, the ground plane"
caption = "In1.Cu, the layer next to the top side: one ground plane, no track."
box = [-2, -4, 116, 114]
layers = ["In1.Cu", "Edge.Cuts"]
minimap = "none"
width = 900

[[step.figure]]
id = "in2"
alt = "Inner layer 2, the 3.3 V plane with the shunt plane and the valve lanes"
caption = "In2.Cu, the layer next to the bottom side: the 3.3 V plane, the shunt plane under the triacs and the copies of the nine valve lanes."
box = [-2, -4, 116, 114]
layers = ["In2.Cu", "Edge.Cuts"]
minimap = "none"
width = 900

