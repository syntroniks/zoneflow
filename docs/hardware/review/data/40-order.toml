[[step]]
id = "o-prev-d25"
group = "order"
title = "Placement preview: D25, cathode bar at the left"
source = "Layout review, section 17, item 5, and section 16"
findings = ["L23", "L1"]
minutes = 3
files = ["hardware/rules/jlcpcb-cpl-rotations.csv"]
remedies = [
  { id = "fix-rotation", text = "Add or correct the row for this part number in `hardware/rules/jlcpcb-cpl-rotations.csv`, then run `make cpl-check`." },
]
check = '''
In JLCPCB's placement preview, find D25 at (12.9, 36.8). The cathode bar of the part must point
left, towards the board edge.
'''
why = '''
This is the one part whose direction no program could check, because JLCPCB's library does not name
its pads. A reversed D25 shorts the 5 V rail through a forward diode and the board never starts.
See the D25 step in the datasheet group for what the maker's sheet says.
'''
good = '''
The drawing of the part in the preview has its bar, or its pad 1 mark, at the left end, over the
pad that the picture shows in yellow.
'''
bad = '''
- **The bar at the right.** Rotate the part by 180 degrees in the preview, and write down that you
  did, because the correction table then needs a row for this part number.
- **The preview shows a part with no polarity mark.** Then JLCPCB's drawing cannot answer the
  question. Ask their support which end of C83270 is the cathode in their tape, or accept the risk
  and note it.
'''
how = '''
The preview is on the assembly page after BOM matching. D25 is at the left of the board, a third of
the way up, right of the inductor L1.
'''
cannot = '''
I cannot show JLCPCB's preview. Nobody has seen it for this board. The picture shows how the part
must lie on the board.
'''

[[step.figure]]
id = "d25"
alt = "D25 on the board with its cathode pad marked"
