# Steps done at the command line and on JLCPCB's order pages.

[[step]]
id = "o-commands"
group = "order"
title = "Run the two commands that guard the order"
source = "Layout review, section 17, items 2 and 5"
findings = ["L1", "L9"]
minutes = 5
files = ["hardware/rules/jlcpcb-cpl-rotations.csv", "hardware/rules/jlcpcb.toml", "hardware/zoneflow-a/design/footprints.py"]
remedies = [
  { id = "fix-rotation", text = "Correct the row of the part that does not fit in `hardware/rules/jlcpcb-cpl-rotations.csv`." },
  { id = "fix-hole", text = "Find the hole under 0.3 mm and correct its footprint in `design/footprints.py`." },
]
check = '''
Run the placement check and the search for small holes on the files you are about to upload.
'''
why = '''
The placement check is what found 26 parts that JLCPCB would have placed wrong, the nine triacs and
the nine opto-triacs among them. It is not part of the normal build, because it needs the network.
The hole search finds any hole under 0.3 mm, which JLCPCB charges for and which switches the order
to a costlier material.
'''
good = '''
```
$ make -C hardware/zoneflow-a cpl-check
...
zoneflow-a-cpl-jlcpcb.csv: 312 placements compared, 0 do not fit.
```

and for the 4-zone file 267 placements, 0 do not fit. Then

```
$ grep '^T.*C0\\.[012]' hardware/zoneflow-a/output/gerbers/*.drl
```

prints nothing. I ran this second command on the committed files on 2026-11-11 and it printed
nothing. The smallest tool in either drill file is 0.300 mm. I did not run the first: the committed
report `output/reports/placement-check.md` has its last result.
'''
bad = '''
- **Any number but 0** before "do not fit". Do not upload.
- **Any line from the search.** A hole under 0.3 mm is in the files.
'''
how = '''
Both commands run in the repository root. `make cpl-check` needs KiCad 10 and fetches JLCPCB's
library footprints once. Upload the files from the same checkout you ran them on.
'''
cannot = '''
This step has no place on the board to look at. The check is a program's answer.
'''

