[[step]]
id = "o-prev-triacs"
group = "order"
title = "Placement preview: the nine triacs, tab towards the terminals"
source = "Layout review, section 17, item 5. Finding L1"
findings = ["L1"]
minutes = 3
files = ["hardware/rules/jlcpcb-cpl-rotations.csv"]
remedies = [
  { id = "fix-rotation", text = "Add or correct the row for this part number in `hardware/rules/jlcpcb-cpl-rotations.csv`, then run `make cpl-check`." },
]
check = '''
Find the nine triacs Q901, Q101 to Q801 in a row at y = 30. On each, the large tab must point down,
towards the terminals, and the two leads up, towards the LEDs.
'''
why = '''
The placement file as first committed had all nine a quarter turn off and 1.3 mm from their lands.
If the triacs are turned, every valve output is dead. Turning nine DPAK parts by hand on lands with
heat copper under them is slow and risks the lands. The correction is in the files now, and this
look confirms that JLCPCB reads them the same way.
'''
good = '''
Each of the nine sits on its three lands: the tab on the large land at the bottom, the two leads on
the two small lands at the top. All nine look the same.
'''
bad = '''
- **A part lying across its lands.**
- **Tab up.** The leads would sit on the tab land.
'''
how = '''
The row is in the lower half of the board, above the resettable fuses. Pad 1, at the upper right of
each, is A1 on net `ISNS`. Pad 3, at the upper left, is the gate.
'''
fact = '''
**ST DocID7472 rev 12**, T810, front page drawing, as the reviewer read it: with the tab away and
the leads towards you, the leads are A1, A2, gate from the left, and the tab is A2. I opened the
copy LCSC serves for [C155588](https://www.lcsc.com/datasheet/C155588.pdf) and did not read the DPAK
drawing myself.
'''
cannot = '''
I cannot show JLCPCB's preview. The picture shows two of the nine and how they must lie.
'''
kicad = { find = ["Q901", "Q101"], layers = ["F.Cu", "F.Silkscreen", "F.Fab"], at = [49.95, 30.44] }
ibom = { ref = "Q101" }

[[step.figure]]
id = "two"
alt = "Two triacs with pad numbers and nets"
caption = "Q901 and Q101, the first two of the row, on F.Cu with silkscreen and outline. Tab down, leads up."
box = [38.5, 24.5, 54.5, 38.0]
layers = ["F.Cu", "F.Silkscreen", "F.Fab", "Edge.Cuts"]
pad_labels = ["Q901", "Q101"]
marks = [{ refs = ["Q901", "Q101"], label = "triacs" }]

