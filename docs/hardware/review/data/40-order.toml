[[step]]
id = "o-prev-optos"
group = "order"
title = "Placement preview: the nine opto-triacs, pin 1 at the lower left"
source = "Layout review, section 17, item 5. Finding L1"
findings = ["L1"]
minutes = 3
files = ["hardware/rules/jlcpcb-cpl-rotations.csv"]
remedies = [
  { id = "fix-rotation", text = "Add or correct the row for this part number in `hardware/rules/jlcpcb-cpl-rotations.csv`, then run `make cpl-check`." },
]
check = '''
Find the nine opto-triacs U901, U101 to U801 in a row at y = 50.8. On each, the notch or the dot
that marks pin 1 must be at the lower left.
'''
why = '''
These were also a quarter turn off in the first placement file. A quarter turn shows, because the
part then lies across its lands. A half turn does not: the part fits its lands, its LED sits on a
gate pad and an unused pad, and that output never turns on. Nothing on the board tells you why.
'''
good = '''
Each part has three leads at the bottom and three at the top. The pin 1 mark is at the bottom row,
left end. The bottom row is the LED side: pad 1 `OLA`, pad 2 the drive line from the expander.
'''
bad = '''
- **The mark at the upper right.** The part is turned half round. This fits the lands, so look at
  the mark and not at the fit.
- **Leads at the left and right.** A quarter turn.
'''
how = '''
The row is just above the LED row. In JLCPCB's preview pin 1 is usually a dot on the body or a
coloured pad.
'''
fact = '''
**onsemi MOC3023M/D**, [data sheet](https://www.onsemi.com/download/data-sheet/pdf/moc3023m-d.pdf),
figure 1, "Schematic": 1 anode, 2 cathode, 3 no connection, 4 main terminal, 5 no connection, 6
main terminal.
'''
cannot = '''
I cannot show JLCPCB's preview. The picture shows two of the nine and how they must lie.
'''
kicad = { find = ["U901", "U101"], layers = ["F.Cu", "F.Silkscreen", "F.Fab"], at = [35.5, 50.8] }
ibom = { ref = "U101" }

