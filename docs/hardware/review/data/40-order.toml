[[step]]
id = "o-ask"
group = "order"
title = "Two questions for JLCPCB that nobody has asked"
source = "Layout review, section 17, closing paragraph. Layout document, section 14, items 2 and 8"
findings = ["L6"]
minutes = 5
files = ["docs/design/mechanical.md"]
remedies = [
  { id = "builder-solders", text = "JLCPCB will not fit C1 and K1: write on the ordering page that the builder solders them." },
]
check = '''
Ask JLCPCB's support two things before you pay, and record the answers in the note.
'''
why = '''
- **Who solders C1 and K1.** They are through-hole parts inserted from the bottom side and soldered
  from the top. Whether JLCPCB hand-solders parts on the side opposite the SMT has not been asked.
  If not, you solder them, and the order is the same.
- **Hole plating.** The short-circuit calculation for the output vias uses 18 um, which JLCPCB
  publishes as its average. The reviewer found no minimum. With four vias per output the margin is
  wide: 33 K of heating in the worst case.
'''
good = '''
- **You have an answer on C1 and K1,** yes or no, and know who fits them.
- **You have a plating figure,** or JLCPCB's statement that it gives none. Either way you know
  what the 33 K rests on.
'''
bad = '''
- **JLCPCB will fit C1 and K1 only from the top side.** Do not accept that: neither part fits
  under the display.
'''
how = '''
Use the chat or the remark field of the order. For C1 and K1, send the picture below or the bottom
assembly drawing. The soldering access is a rule the build checks: no part taller than 1.5 mm
within 2.5 mm of their top-side pads.
'''
cannot = '''
The answers are JLCPCB's to give.
'''
kicad = { find = ["C1", "K1"], layers = ["F.Cu", "F.Fab", "B.Fab"], at = [20.0, 28.0] }

[[step.figure]]
id = "access"
alt = "The top side round the solder pads of C1 and K1"
caption = "Seen from above. Marked: C1 and K1, which hang under the board. Their pads are soldered from this side, between the parts drawn in grey."
box = [-2.0, 14.5, 42.0, 41.5]
layers = ["F.Cu", "B.Fab", "F.Fab", "Edge.Cuts"]
zones = false
marks = [{ refs = ["C1", "K1"], label = "C1 and K1, on the bottom side" }]
pad_labels = ["C1", "K1"]
pad_label_mode = "number"
