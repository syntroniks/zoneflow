]
check = '''
In JLCPCB's BOM step, deselect the six lines that are fitted by hand. Then check the two counts.
'''
why = '''
The BOM lists seven parts that are not in the placement file, and nothing in the files marks them.
If you leave them selected, JLCPCB finds BOM lines with no placement and the order waits for your
answer. C1 and K1 go in from the bottom side, J1 to J4 from the top, and the display plugs in
at final assembly.
'''
good = '''
Deselected:

| Part | LCSC number |
|---|---|
| C1, bulk capacitor | C2940725 |
| K1, relay | C48746 |
| J1, 2-way header | C441182 |
| J2 and J4, 7-way headers | C441187 |
| J3, 4-way header | C441184 |
| DS1, display panel | C5329582 |

- **8-zone build:** 89 lines remain, and the placement count is 312.
- **4-zone build,** which has no J3: 89 lines remain, and the count is 267.
- **No substitution.** If JLCPCB proposes another part for a line that is short, compare it with
  the [BOM](doc:hardware/bom.md) before you accept. The display has no confirmed second source.
'''
bad = '''
- **Another count.** A line was dropped or added on the way. Find it before you go on.
- **A line marked "no stock"** for a part with nine or more on the board: the triac, the opto-triac
