remedies = [
  { id = "fiducials", text = "Add three fiducial marks to the board in `design/layout.py`, so that placement does not depend on rails." },
]
check = '''
Select assembly for the top side only, and ask JLCPCB to add process edges with tooling holes and
fiducial marks on the left and right sides.
'''
why = '''
The board has no fiducial mark of its own, so the placement machine has nothing to align to. The
module hangs 6.0 mm over the top edge and the headers and the USB socket over the bottom edge, so
a rail cannot go there. Parts stand 0.6 to 0.9 mm from the right edge, where a conveyor would hold
a bare board.
'''
good = '''
- **Assembly side:** top.
- **JLCPCB's panel drawing** shows a rail along each of the two 110 mm sides, with fiducials and
  tooling holes on the rails, and no rail along the top or the bottom edge.
'''
bad = '''
- **A rail along the top edge.** The module cannot be placed over it.
- **No fiducials anywhere** in the drawing JLCPCB sends back.
'''
how = '''
On the assembly page, look for the option that adds edge rails or process edges. JLCPCB's
engineers confirm the panel by e-mail or in the order's file review. Read their drawing before you
approve it.
'''
cannot = '''
I did not open JLCPCB's order pages. The picture shows what overhangs which edge.
'''

