[[step]]
id = "o-prev-leds"
group = "order"
title = "Placement preview: the eleven LEDs, cathode at the left"
source = "Layout review, section 17, item 5"
findings = ["L1"]
minutes = 4
files = ["hardware/rules/jlcpcb-cpl-rotations.csv"]
remedies = [
  { id = "fix-rotation", text = "Add or correct the row for this part number in `hardware/rules/jlcpcb-cpl-rotations.csv`, then run `make cpl-check`." },
]
check = '''
Find the ten LEDs along y = 42 and the fault LED D8 at (9.9, 79.2). On each, the cathode mark must
be at the left.
'''
why = '''
An LED the wrong way round stays dark. The ten in the row are the status light and the nine output
indicators. Each output LED has its own resistor and is not in series with the opto-triac, so a
dark one does not stop a valve. But the installer tests zones by these lights. The two LED types number their pads
differently in JLCPCB's library, which is the kind of difference that turns one type round.
'''
good = '''
- **The row:** D6, D902, D102, D202, D302, D402, D502, D602, D702, D802 from left to right. Each
  has its cathode mark at the left.
- **D8,** the red one, above and left of U7: cathode at the left.
'''
bad = '''
One type is right and the other is turned round. D8 is the only LED of its type, so look at it
on its own.
'''
how = '''
The review's checklist says "the eleven LEDs along y = 42 and D8". The board has ten in the row,
and D8 makes eleven. In KiCad's `LED_0603` footprint pad 1 is the cathode.
'''
fact = '''
**Lite-On LTST-C190KGKT** data sheet, the copy LCSC serves for [C125094](https://www.lcsc.com/datasheet/C125094.pdf),
section 2, "Package Dimensions": the drawing marks the cathode end of the part. **KENTO KT-0603R**,
the copy for [C2286](https://www.lcsc.com/datasheet/C2286.pdf), section 2: the drawing marks one end
in green and gives the diode symbol beside it. I looked at both drawings and did not check either
against a part.
'''
cannot = '''
I cannot show JLCPCB's preview. The picture shows three of the row and how they must lie.
'''
kicad = { find = ["D6", "D902", "D102", "D8"], layers = ["F.Cu", "F.Silkscreen", "F.Fab"], at = [12.0, 42.0] }

[[step.figure]]
id = "row"
alt = "The first three LEDs of the row with their pad numbers"
caption = "D6, D902 and D102, the first three of the row, on F.Cu with silkscreen. Pad 1, the cathode, is the left pad of each."
box = [9.0, 38.6, 38.0, 45.4]
layers = ["F.Cu", "F.Silkscreen", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["D6", "D902", "D102"]
pad_label_mode = "number"
marks = [{ refs = ["D6", "D902", "D102"], label = "LEDs" }]

[[step.figure]]
