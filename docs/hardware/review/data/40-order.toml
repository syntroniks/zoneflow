[[step]]
id = "o-options"
group = "order"
title = "Board options that match the calculations"
source = "Layout review, section 17, item 2. Finding L12"
findings = ["L12", "L9"]
minutes = 6
files = ["hardware/rules/jlcpcb.toml"]
remedies = [
  { id = "update-rules", text = "Record what JLCPCB's page charges for in `hardware/rules/jlcpcb.toml` and on the ordering page, with the date." },
]
check = '''
Upload the Gerber and drill files and set the board options. Then read the price breakdown.
'''
why = '''
The current and heating calculations assume 1 oz outer copper and JLCPCB's standard hole plating.
The Gerber job file in the upload carries KiCad's default stack-up, which is not the build you
order, and JLCPCB does not read it. So the options you click are the only statement of the build.
'''
good = '''
- **Layers** 4. **Size** 114 x 110 mm. **Thickness** 1.6 mm. **Material** FR-4.
- **Outer copper** 1 oz. **Inner copper** 0.5 oz.
- **Smallest hole** 0.3 mm. **Via covering** tented.
- **No** gold fingers and **no** castellated holes.
- **Surface finish** ENIG. The display connector has 0.3 mm lands on a 0.5 mm pitch and the module
  has forty castellations, and a flat finish helps both.
- **The price breakdown** shows no charge for small holes and no forced material upgrade.
'''
bad = '''
- **A surcharge for hole size or a four-wire test.** Stop and run the hole search of the previous
  step.
- **The page proposes another material** than standard FR-4 without your asking.
'''
how = '''
Zip the contents of `hardware/zoneflow-a/output/gerbers/` and upload the zip on JLCPCB's quote
page. The page fills in size and layer count from the files. The option names here are from the
layout review and the [ordering page](doc:hardware/ordering.md), which read them from JLCPCB's
capabilities page on 2026-11-10 and 2026-11-11. JLCPCB may have renamed them since.
'''
cannot = '''
I did not open JLCPCB's order pages, so there is no picture of them here.
'''

