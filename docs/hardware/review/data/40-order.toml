'''
how = '''
Upload `zoneflow-a-bom-jlcpcb.csv` and `zoneflow-a-cpl-jlcpcb.csv`, or the two `-4-zone` files. You
still need the six part types for hand assembly: order them from LCSC, or leave them selected in a
separate parts order.
'''
cannot = '''
