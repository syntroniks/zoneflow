[[step]]
id = "p-j7"
group = "print"
title = "The display connector J7"
source = "Layout review, section 17, item 1. Footprint notes, open point 1"
findings = ["L23"]
minutes = 5
check = '''
Lay an FPC-05F-12PH20 connector on J7: the twelve contact tails on the twelve narrow lands, the
mouth towards the right.
'''
why = '''
The maker's drawing does not say where the body sits against the lands. The author took that one
figure from JLCPCB's library and asked for a check against a part. The enclosure fixes where the
mouth must be, x = 63.0, so a body that sits elsewhere moves the flat cable by the same amount.
'''
good = '''
- **The twelve tails** sit on the twelve lands, 0.5 mm apart, at the left, closed side of the body.
- **The two solder tabs** sit on the two large lands above and below.
- **The mouth,** where the cable enters, faces right and is at the right edge of the outline.
- **Pad 1** is the lowest of the twelve.
'''
bad = '''
- **The tabs miss their lands** while the tails are on theirs. The body position is wrong.
- **The mouth faces left.** The footprint would be turned half round.
'''
how = '''
Without the part, measure the print. Signal lands 0.30 x 1.25 mm at 0.50 mm pitch. Tab lands 2.00 x
2.50 mm. Body 10.40 mm along the row and 5.12 mm deep.
'''
fact = '''
**XUNPU FPC-05F-NPH20 drawing, revision A**, as recorded in
[`design/footprints.md`](repo:hardware/zoneflow-a/design/footprints.md), section 1.2. I did not
open this drawing again. The distributor lists the part as bottom contact with a flip lock.
'''
kicad = { find = ["J7"], layers = ["F.Cu", "F.Fab"], at = [60.44, 88.43] }
ibom = { ref = "J7" }

[[step.figure]]
id = "lands"
alt = "The lands of J7 with the net on each"
caption = "J7 on F.Cu with the body outline. The twelve narrow lands are at the left. Pad 1 is the lowest."
around = ["J7"]
margin = 1.6
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["J7"]
callouts = [
  { pad = "J7.1", text = "pad 1", dx = -2.6, dy = -1.5 },
  { at = [63.0, 88.43], text = "mouth: the cable enters here", dx = 3.3, dy = 3.6 },
]

