[[step]]
id = "p-bt1"
group = "print"
title = "The coin cell holder BT1"
source = "Layout review, section 17, item 1"
findings = ["L23"]
minutes = 3
check = '''
Lay a CR2032-BS-6-1 holder on BT1 with its + mark at the left.
'''
why = '''
A holder fitted the other way round puts the cell in backwards. The clock then never runs from the
cell and loses the time at every power cut.
'''
good = '''
- **The two solder tabs** on the two lands, 32 mm over their outer edges.
- **The + mark** of the holder at the left land, pad 1, net `VBAT`.
- **The silkscreen** has `+` and `CR2032` at this part.
'''
bad = '''
- **The holder fits only with + at the right.** Then the footprint is the mirror of the part.
'''
how = '''
Without the part, measure the print: 32.0 mm over the lands, 26.0 mm between them, lands 4.2 mm
wide.
'''
fact = '''
**Q&J drawing BS-6, 2011-02-14**, as recorded in
[`design/footprints.md`](repo:hardware/zoneflow-a/design/footprints.md), section 1.3, and read
again by the reviewer: the land marked + is at the right in the drawing's top view, and the part is
turned half round on the board, so + is at the left.
'''
kicad = { find = ["BT1"], nets = ["/RTC/VBAT"], layers = ["F.Cu", "F.Fab", "F.Silkscreen"], at = [95.0, 65.3] }
ibom = { ref = "BT1" }

[[step.figure]]
id = "lands"
alt = "The two lands of the cell holder BT1"
caption = "BT1 on F.Cu with silkscreen and outline. Yellow is the cell's positive net. Pad 1, at the left, is +."
box = [77.0, 54.5, 113.0, 76.0]
layers = ["F.Cu", "F.Silkscreen", "F.Fab", "Edge.Cuts"]
zones = false
marks = [{ nets = ["/RTC/VBAT"], label = "VBAT, the + of the cell" }]
pad_labels = ["BT1"]
minimap = "bl"

