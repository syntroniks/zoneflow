# Steps done on the true-size print, and the two done with parts in hand.

[[step]]
id = "p-scale"
group = "print"
title = "Print both sides at true size and check the scale"
source = "Layout review, section 17, item 1"
minutes = 5
check = '''
Print the [bench sheet](doc:hardware/review/bench-sheet.md) at 100 %. Measure the two scale bars and
the board edge on each drawing with callipers.
'''
why = '''
Every step in this group lays a part on the paper. A printer that scales by 2 % moves the last pin
of a 7-way header by half a millimetre, and you would reject a good footprint or accept a bad one.
'''
good = '''
- **Each scale bar** measures 100.0 mm, within 0.3 mm.
- **The board edge** measures 114.0 mm across and 110.0 mm up, within 0.3 mm.
- **Both directions agree.** Some printers scale the feed direction only.
'''
bad = '''
- **Either bar is off by more than 0.5 mm.** Find the "actual size" setting in the print dialog,
  turn "fit to page" off and print again. Do not go on with a wrong print.
'''
how = '''
The bench sheet has the top and the bottom drawing, each on its own page with a horizontal and a
vertical bar. The same drawings exist as PDF from KiCad: [top](out:zoneflow-a-assembly-top.pdf) and
[bottom](out:zoneflow-a-assembly-bottom.pdf). Those have no scale bar, so measure the board edge.
'''
cannot = '''
No picture can show you your own print. The drawing below is the top page of the bench sheet, shown
small.
'''

[[step.figure]]
id = "sheet"
alt = "The top side of the board as part outlines, with two scale bars"
caption = "The top page of the bench sheet, shown small: lands, part outlines and designators, with a 100 mm bar along each direction."
asset = "assembly-top.svg"

# ---------------------------------------------------------------------------------------------------

[[step]]
id = "p-headers"
group = "print"
title = "The four terminal headers J1 to J4"
source = "Layout review, section 17, item 1"
findings = ["L23"]
minutes = 6
check = '''
Lay a KF2EDGR-3.81 header on each of J1 to J4 on the top print: 2-way on J1, 7-way on J2 and J4,
4-way on J3.
'''
why = '''
This footprint was written for this project from the maker's drawing, because the usual substitute
has smaller holes. Nobody has held the part against it. If the pitch or the row position is wrong,
the headers do not go in, or they go in and the plugs foul the enclosure wall.
'''
good = '''
- **Every pin** stands on the centre of a hole circle. The last pin of a 7-way header is 22.86 mm
  from the first.
- **The back of the body** is flush with the line at y = 7.2, 1.3 mm behind the pin row.
- **The mating face** hangs 2.0 mm over the bottom board edge.
- **J2 and J3** stand end to end with a gap of about 0.6 mm and do not push each other.
'''
bad = '''
- **Pins drift off the holes** along the row. The pitch is wrong, or the print scale is.
- **The body covers a terminal label** or the pads of F4 and F1 behind it.
- **J2 and J3 collide.**
'''
how = '''
Without the parts, measure on the print. Pitch 3.81 mm. Hole 1.4 mm, drawn as a circle. Pin row to
the rear face 1.3 mm. Body depth 9.2 mm. Body length 8.42, 16.04 and 27.47 mm for 2, 4 and 7 ways.
These are the figures of the Kefa drawing as `design/footprints.md` records them.
'''
fact = '''
**Cixi Kefa KF2EDGR-3.81 drawing, revision A, 2021-03-13**, as recorded in
[`design/footprints.md`](repo:hardware/zoneflow-a/design/footprints.md), section 1.1. I did not
open this drawing again. The drawing does not say which end is pin 1, and only the labels depend
on it.
'''
kicad = { find = ["J1", "J2", "J3", "J4"], layers = ["F.Cu", "F.Fab"], at = [57.0, 5.9] }

[[step.figure]]
id = "left"
alt = "The lands and outlines of headers J1 and J2"
caption = "J1 and J2: holes, lands and the body outline from the fabrication layer. The body reaches 2 mm beyond the board edge, the pale line at y = 0."
box = [13.5, -3.5, 57.5, 10.5]
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["J1", "J2"]
minimap = "none"

[[step.figure]]
id = "right"
alt = "The lands and outlines of headers J3 and J4"
caption = "J3 and J4."
box = [54.5, -3.5, 105.5, 10.5]
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["J3", "J4"]
minimap = "none"

