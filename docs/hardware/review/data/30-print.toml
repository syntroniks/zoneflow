[[step]]
id = "h-display"
group = "hand"
title = "The display panel's flat cable against J7"
source = "Layout review, section 16, \"The panel and its tail\". Mechanical design, section 10"
findings = ["L23"]
minutes = 10
check = '''
With the sample panel: find which face of the cable's end has the contacts, find pin 1, measure
the cable, and check that it reaches J7 when folded under the panel.
'''
why = '''
Four things about this cable were read from one drawing and never seen: the contact side, the pin 1
end, where the cable leaves the panel, and its length. The connector is a bottom-contact type and
the netlist puts panel pin 1 on pad 1. If the contacts face the other way the display stays dark.
If pin 1 is at the other end, the backlight supply lands on the logic pins.
'''
good = '''
- **Contacts.** With the screen facing you and the cable hanging down, you see the twelve gold
  fingers. The back of the cable's end has a stiffener.
- **Pin 1.** In that same view pin 1 is the leftmost finger.
- **Size.** The cable is 6.5 mm wide and reaches 20.7 mm, within 0.5 mm, beyond the panel's edge.
  Its near edge is 15.28 mm from one long edge of the panel.
- **Fit.** With the panel 8.85 mm above the print and the cable folded back under it in a C, the
  end reaches the mouth of J7 with about 3 mm to go in.
'''
bad = '''
- **Fingers on the back face.** J7 must then be the top-contact version of the same connector. The
  footprint stays.
- **Pin 1 at the right.** The netlist of J7 has to be reversed.
- **The cable does not reach.** J7 moves along x, and it is the only part that moves.
'''
how = '''
The panel is used turned a quarter, with its cable edge at the right, so in the board's frame the
cable enters J7 from the right and pin 1 is the lowest pad. Hold the panel over the top print at
its place to try the fold. Compare the pin list in the panel's own sheet with what the board puts
on J7: 1 ground, 2 chip select, 3 data/command, 4 clock, 5 data, 6 reset, 7 not connected, 8 and 9
the 3.3 V supply, 10 backlight anode, 11 backlight cathode, 12 ground.
'''
fact = '''
**Hansheng HS20HS072RX outline drawing**, as read by the mechanical design, section 7, the hardware
design, section 16.4, and the reviewer. I did not open it. The contact side is "not stated in
words" in the drawing: all three readers took it from how the two views are drawn.
'''
cannot = '''
I cannot show the panel: the repository has no drawing of it that I may copy, and nobody has a
sample yet. The picture shows the board's side of the joint.
'''
kicad = { find = ["J7"], layers = ["F.Cu", "F.Fab"], at = [60.44, 88.43] }

[[step.figure]]
id = "j7"
alt = "J7 with the display signals on its twelve lands"
caption = "J7 with the net on each land. Pad 1, the lowest, is panel pin 1. The cable enters from the right."
around = ["J7"]
margin = 1.4
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["J7"]
callouts = [{ pad = "J7.1", text = "pad 1 = panel pin 1, GND", dx = -1.5, dy = -2.2 }]

