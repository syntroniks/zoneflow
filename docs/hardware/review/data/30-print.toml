[[step]]
id = "p-sw3"
group = "print"
title = "The encoder SW3"
source = "Layout review, section 17, item 1. Footprint notes, open point 2"
findings = ["L23"]
minutes = 5
check = '''
Lay an EC11J15 encoder on SW3: five terminals on five lands, the metal frame on its six lands, the
two plastic pegs in the two holes.
'''
why = '''
The footprint was drawn from a 512-pixel image of the maker's drawing. The library footprint the
reviewer compared it with has the three encoder terminals on a 2.54 mm pitch where this one has
2.5 mm. A frame land is 0.25 mm from the pad row of the module, which is close for reflow.
'''
good = '''
- **Three terminals** on the lower three lands, **two** on the upper two.
- **The frame's six feet** on the four corner lands and the two side lands.
- **The centre boss and the locating peg** in the 2.1 mm and 1.6 mm holes.
- **Nothing of the encoder** reaches over the module's pads at the right.
'''
bad = '''
- **A terminal beside its land.**
- **The peg has no hole,** or the hole is on the other side of the centre.
- **The frame touches the module's pad row.**
'''
how = '''
Without the part, measure the print. Terminal lands 1.3 x 2.4 mm. The three lower lands on a 2.5 mm
pitch, the two upper ones 5.0 mm apart. Locating hole 1.6 mm, 4.5 mm from the shaft axis.
'''
fact = '''
**ALPS ALPINE "EC11J Series" product sheet, 2018-03-30**, as recorded in
[`design/footprints.md`](repo:hardware/zoneflow-a/design/footprints.md), section 1.4. I did not
open this sheet again. The author could not read the extent of the four "do not solder and wiring"
areas beside the side lands and estimated them.
'''
kicad = { find = ["SW3"], layers = ["F.Cu", "F.Fab"], at = [85.0, 88.0] }
ibom = { ref = "SW3" }

[[step.figure]]
id = "lands"
alt = "The lands and holes of the encoder SW3"
caption = "SW3 on F.Cu with its outline. Terminals A, C, B at the bottom, S1 and S2 at the top. The large lands hold the frame. The module's pad row is at the right."
around = ["SW3"]
margin = 1.0
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["SW3"]

