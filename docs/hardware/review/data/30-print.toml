[[step]]
id = "p-bottom"
group = "print"
title = "The relay K1 and the capacitor C1 on the bottom print"
source = "Layout review, section 4, rows K1 and C1. Layout document, section 14, item 8"
findings = ["L23"]
minutes = 6
check = '''
Lay the relay and the capacitor on the bottom print, as they are fitted: from the bottom side.
'''
why = '''
A through-hole part fitted from the bottom is the classic place for a mirrored footprint. The
reviewer read the relay's "bottom view" drawing and found the footprint not mirrored. A relay on a
print settles it. The capacitor's polarity matters: reversed, a 470 uF electrolytic on 30 to 45 V
fails within minutes and can vent.
'''
good = '''
- **K1.** All four pins on their holes: three in a row and the fourth beside the first. The body
  stays inside its outline and inside the board edge.
- **C1.** With the can lying inside its outline, the two leads reach the two holes. The lead on the
  can's + side goes to pad 1, the square one, marked `C1 +` on the silkscreen.
'''
bad = '''
- **The relay fits only when you turn the paper over.** The footprint is mirrored.
- **The capacitor's stripe,** which marks minus, is at the square pad.
'''
how = '''
The bottom print is mirrored, as the board looks from below. Without the parts, measure. K1: four
1.1 mm holes, the two coil pins 4.7 mm apart, the contact pins 11.5 and 18.5 mm from the coil. C1:
leads 5.0 mm apart, can 13.0 x 22.0 mm at most.
'''
fact = '''
**Omron G5NB data sheet**, "PCB mounting holes (bottom view)", and the **Rubycon ZLJ series sheet**,
both as recorded in [`design/footprints.md`](repo:hardware/zoneflow-a/design/footprints.md),
sections 1.6 and 2. I did not open these again. The relay has no coil polarity.
'''
kicad = { find = ["K1", "C1"], nets = ["VIN_DC"], layers = ["B.Cu", "B.Fab", "B.Silkscreen"], at = [20.0, 28.0] }

[[step.figure]]
id = "parts"
alt = "The holes and outlines of K1 and C1 seen from below"
caption = "Seen from below, as the bottom print shows it. Yellow is the positive net of C1, at the square pad. K1 is at the right in this view, under the left edge of the board."
box = [-1.5, 15.5, 41.0, 41.0]
view = "bottom"
layers = ["B.Cu", "B.Silkscreen", "B.Fab", "Edge.Cuts"]
zones = false
marks = [{ nets = ["VIN_DC"], label = "VIN_DC, the + of C1" }]
pad_labels = ["K1", "C1"]
minimap = "none"

