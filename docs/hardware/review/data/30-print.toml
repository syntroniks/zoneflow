[[step]]
id = "p-j5"
group = "print"
title = "The USB-C receptacle J5"
source = "Layout review, section 17, item 1"
findings = ["L23"]
minutes = 3
check = '''
Lay a TYPE-C-31-M-12 receptacle on J5.
'''
why = '''
The shell's four legs go through slots in the board. If the slots are off, the part does not seat
and the twelve small lands, 0.3 mm wide, do not line up.
'''
good = '''
- **The four shell legs** in the four slots.
- **The two plastic pegs** in the two small round holes.
- **The row of contacts** on the row of lands at the top of the footprint.
- **The front of the shell** about 1 mm beyond the board edge.
'''
bad = '''
- **A leg beside its slot.**
- **The shell front inside the board edge.** The plug would not reach.
'''
how = '''
Without the part, measure the print: pegs 5.78 mm apart, slots 8.65 mm apart across the part and
4.18 mm between the two rows.
'''
fact = '''
**HRO drawing TYPE-C-31-M-12, 2020-12-08**, as recorded in
[`design/footprints.md`](repo:hardware/zoneflow-a/design/footprints.md), section 2. I did not open
this drawing again. The reviewer compared the footprint with JLCPCB's library footprint: all lands
and slots within 0.11 mm.
'''
kicad = { find = ["J5"], layers = ["F.Cu", "F.Fab"], at = [8.0, 2.67] }
ibom = { ref = "J5" }

[[step.figure]]
id = "lands"
alt = "The lands, slots and holes of the USB-C receptacle J5"
caption = "J5 on F.Cu with its outline. Four slots for the shell, two round holes for the pegs, the contact lands at the top."
box = [1.5, -2.5, 14.5, 9.0]
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
minimap = "none"

