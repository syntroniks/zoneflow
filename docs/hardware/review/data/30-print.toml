[[step]]
id = "h-heights"
group = "hand"
title = "Measure the parts KiCad has no model for"
source = "Layout review, section 13, \"What it does not\", and section 16"
findings = ["L24"]
minutes = 10
check = '''
Measure the height of each part in the table with callipers and compare it with the height the
enclosure was designed for.
'''
why = '''
The reviewer tested the enclosure against the real 3D model of the board. KiCad has no model for
these parts, so for them the check used boxes from the mechanical contract. A part that is taller
than its box meets the fascia or the display carrier, and you find out when the first enclosure
does not close.
'''
good = '''
Each part is no taller than its figure:

| Part | Designed height, mm |
|---|---|
| Fuse holders F1 and F4, with a fuse fitted | 3.81 |
| Resettable fuses F101 to F901 | 2.1 |
| Display connector J7 | 2.0 |
| Buttons SW4 and SW5 | 10.0 |
| Encoder SW3, to the top of the shaft | 24.5 |
| Cell holder BT1 | 5.5 |
| USB-C receptacle J5 | 3.26 |
| Terminal headers J1 to J4 | 7.0 |
| Relay K1, bottom side | 15.3 |
| Capacitor C1, lying down, bottom side | 13.0 |
'''
bad = '''
A part more than 0.3 mm taller than its figure. Note which, and by how much.
'''
how = '''
The figures are the `heights` list of `hardware/mechanical.yaml`. If you have no parts yet, mark
this step "not sure" and do it when the parts for hand assembly arrive. It does not hold up the
board order, because the board is the same either way. It holds up printing the enclosure.
'''
cannot = '''
A picture cannot show a height. The picture shows where these parts are.
'''

[[step.figure]]
id = "where"
alt = "The parts without a 3D model marked on the top side"
caption = "Top side. The marked parts have no 3D model in KiCad: fuse holders, one of the nine resettable fuses, display connector, buttons, encoder, cell holder, USB-C."
box = [-3, -4, 117, 112]
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
text = false
minimap = "none"
marks = [{ refs = ["F1", "F4", "F101", "J7", "SW4", "SW5", "SW3", "BT1", "J5"], label = "no 3D model" }]
