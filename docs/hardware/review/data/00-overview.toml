# Content of the pre-order review walkthrough: what frames the steps.
#
# tools/mkdocs_hooks/review_walkthrough.py turns these files into the page, and
# tools/reviewwalk draws the pictures they describe from the board file. Text
# fields are Markdown. Links use three short forms that the page builder
# resolves: doc:<path under docs/>, out:<file in hardware/zoneflow-a/output/>,
# repo:<path in the repository>.
#
# Every reference designator named in a step or a finding must be a part on
# the board: `python -m reviewwalk check` and the site build fail otherwise.
#
# For the hand-off to a coding agent a step also says what an implementer
# needs: `kind = "decision"` for a step that is answered "accepted" or
# "rejected" instead of pass or fail; `files`, the sources a change would be
# made in (a group gives the files that all its steps share); and `remedies`,
# the few likely cures the owner can pick from when the step fails. Every
# file named must exist in the repository.

[meta]
issue = 33
repo = "syntroniks/zoneflow"
# Words that look like reference designators and are not parts of the board.
not_parts = [
  "DS1",                    # the display panel: in the BOM, not on the board
  "C0",                     # part of the drill-file search pattern
]
print_note = "Lay each part on its lands. Every lead must sit on a land and no body may cover a neighbour's land."

# The numbered boxes on the orientation picture. Board coordinates, millimetres.
[[block]]
name = "Terminals, USB-C and Qwiic"
box = [2.5, -1.8, 113.5, 8.2]
text = "The bottom edge. USB-C at the left, then the four pluggable terminal headers J1 to J4, then the Qwiic connector J6. Each terminal has its name printed behind it."

[[block]]
name = "24 VAC input and logic supply"
box = [8.5, 9.0, 38.6, 40.0]
text = "The two fuse holders F4 and F1, the surge clamp D1, the rectifier D2, the fuse F5, the buck converter U1 with its inductor L1 and the clamp D25. This makes 5.3 V from 24 VAC."

[[block]]
name = "Nine output columns"
box = [39.2, 9.0, 103.6, 38.6]
text = "One column per valve output, 7.1 mm apart. From the terminal upward: surge clamp and snubber, resettable fuse, triac. The first column is the master valve, then zones 1 to 8."

[[block]]
name = "LED row and opto-triacs"
box = [8.5, 39.6, 108.0, 57.2]
badge = [60.0, 57.2]
text = "One LED per output under the light pipes, and above each LED the opto-triac that fires that output's triac."

[[block]]
name = "5 V and 3.3 V"
box = [0.8, 44.8, 19.5, 57.2]
badge = [0.8, 44.8]
text = "The two diodes D3 and D4 that join the buck output and the USB supply, and the 3.3 V regulator U3."

[[block]]
name = "Current measurement and the two buttons"
box = [15.0, 57.8, 55.0, 67.6]
text = "The amplifier U8 that reads the shunt, between the buttons SW4 and SW5."

[[block]]
name = "Under the display"
box = [8.0, 68.2, 56.5, 90.0]
text = "The I/O expander U5, the fail-safe logic U7, the relay driver Q1 and Q2 with keep-alive detector B, and the over-voltage detector U13. The display covers this area once it is fitted."

[[block]]
name = "Display connector and debug pads"
box = [56.9, 78.5, 76.5, 95.5]
badge = [76.5, 95.5]
text = "J7 takes the flat cable of the display. J8 is a row of six holes for a serial adapter and carries no part."

[[block]]
name = "Clock and coin cell"
box = [57.5, 55.0, 112.0, 76.5]
badge = [112.0, 76.5]
text = "The real-time clock U10 with its crystal Y1, and the CR2032 holder BT1."

[[block]]
name = "Module, encoder and keep-alive detector A"
box = [76.5, 77.0, 113.2, 112.0]
badge = [113.2, 96.0]
text = "The ESP32-S3 module U4 with its antenna beyond the top edge, the encoder SW3 beside it, and under the module the comparators U6 and keep-alive detector A. The keep-alive net starts here, at module pin 10."

[[block]]
name = "Sensor inputs"
box = [104.2, 9.0, 113.4, 54.5]
badge = [113.4, 30.0]
text = "Protection for the rain, flow and spare inputs and for the Qwiic connector, at the board edge."

# ---------------------------------------------------------------------------------------------------

[[group]]
id = "kicad"
title = "In KiCad"
tool = "KiCad 10 with `hardware/zoneflow-a/zoneflow-a.kicad_pro` open"
minutes = 60
files = ["hardware/zoneflow-a/design/layout.py", "docs/design/hardware-layout.md"]
intro = """
Nobody has looked at this board in the KiCad window. The author and the reviewer both worked through
`kicad-cli` and scripts. These steps are that first look, and the six places on the copper that the
review asks a person to see.
"""

[[group]]
id = "sheets"
title = "With the datasheets"
tool = "A browser for the makers' datasheets"
minutes = 40
files = ["hardware/netlist.yaml", "hardware/zoneflow-a/design/parts.toml", "hardware/bom-preliminary.csv", "docs/design/hardware-design.md"]
remedies = [
  { id = "netlist", text = "Correct the pin numbers of this part in `hardware/netlist.yaml`, run `make -C hardware design-sync`, then `make` in the board directory." },
  { id = "other-part", text = "Keep the netlist and choose a part whose pinout is the one the netlist has. New part number in `design/parts.toml` and the BOM, from a datasheet that was read." },
]
intro = """
The reviewer compared eleven part types with JLCPCB's library symbol or from memory, and did not open
the maker's sheet. One more, the clamp D25, could not be checked in the library at all. Each step
here shows the part's pads with the net on each, beside the pin list from the maker's sheet. You
compare two short lists.
"""

[[group]]
id = "print"
title = "On the 1:1 print"
tool = "The [bench sheet](doc:hardware/review/bench-sheet.md) printed at 100 %, callipers, and the parts if you have them"
minutes = 40
files = ["hardware/zoneflow-a/design/footprints.py", "hardware/zoneflow-a/design/footprints.md", "hardware/mechanical.yaml"]
remedies = [
  { id = "footprint", text = "Correct the footprint in `design/footprints.py` and its row in `design/footprints.md`, from the maker's drawing." },
  { id = "contract", text = "The footprint is right and the position is wrong: change `hardware/mechanical.yaml` first. The enclosure follows it." },
]
intro = """
A footprint that is wrong by a millimetre passes every check on this board, because the checks
compare the board with its own footprints. A part laid on a true-size print finds it in seconds.
Where you do not have the part, measure the print with callipers against the maker's drawing.
"""

[[group]]
id = "hand"
title = "With parts in hand"
tool = "The sample display panel, callipers, the parts KiCad has no model for"
minutes = 20
files = ["hardware/mechanical.yaml", "docs/design/mechanical.md"]
intro = """
Two things rest on a reading of a drawing and on nothing else: how the display's flat cable meets
its connector, and how tall some parts are.
"""

[[group]]
id = "order"
title = "On JLCPCB's order pages"
tool = "A JLCPCB account. Upload the files and stop before payment"
minutes = 45
files = ["docs/hardware/ordering.md"]
intro = """
Nobody has uploaded these files. You can go through JLCPCB's order pages up to the payment step
without ordering. I did not open those pages, so these steps name the options and cannot show you
the screens.
"""

# ---------------------------------------------------------------------------------------------------
# The two circuit reviews that came before the layout, in summary.

[[earlier]]
id = "A1"
title = "Hardware review A1"
link = "doc:design/hardware-review-a1.md"
what = "The first independent review of the circuit design, before the schematic was captured."
counts = "1 blocking, 7 major, 16 minor, 6 notes"
points = [
  "**Blocking, B1.** The keep-alive detector was a single chain. Five single component faults left gate drive, the expander and the relay enabled with no working keep-alive. A second detector that shares no part with the first now releases the relay.",
  "**M2, M7.** A fuse in the ground leg only, and no surge clamp on the valve common. The board now has a fuse in each transformer wire and a clamp on the common.",
  "**M3.** The relay hold network did not work. The text was corrected and the relay drive redesigned.",
  "**M4, M5.** Two circuit corrections of one resistor each, R87 and R88.",
  "**M1, M6.** The triac is not guaranteed to stop a dead short at the first current zero, and the inrush resistor had no pulse rating. The first is a bench test, the second a new part.",
]

[[earlier]]
id = "A2"
title = "Hardware review A2"
link = "doc:design/hardware-review-a2.md"
what = "The second independent review, of the fail-safe circuits. It injected 376 single faults into a simulation built from the netlist."
counts = "1 blocking, 7 major, 13 minor, 6 notes"
points = [
  "**Blocking, B1.** The keep-alive was on a module pin next to the data strobe of the PSRAM. A solder bridge there kept both detectors on during boot. The keep-alive moved to module pin 10. This is why three steps of this walkthrough look at the copper round that pin.",
  "**M1.** A bridge from the keep-alive net to the zero-cross net could hold both detectors. R33 went from 10 kohm to 2.2 kohm.",
  "**M2.** A failed buck regulator put the rectified input on every 5 V part. The clamp D25 and the fuse F5 are the answer. D25 has its own step here because its polarity could not be checked in JLCPCB's library.",
  "**M5.** A shorted 3.3 V regulator was open when the review ended. The [answers to review A2](doc:design/hardware-answers-a2.md) added the detector U13, which removes drive above about 4.0 V.",
  "**M3, M4, M6, M7.** Changes to the self-test and to the keep-alive contract, which the firmware follows.",
]
