box = [45.5, 15.5, 54.5, 33.0]
layers = ["F.Cu", "F.Silkscreen", "Edge.Cuts"]
marks = [{ nets = ["/Z1/T2"], refs = ["F101"], label = "T2 of zone 1, and the PTC F101" }]
callouts = [{ at = [49.95, 25.6], text = "5 mm wide link", dx = 2.8, dy = -3.2 }]

[[step.figure]]
id = "kelvin"
alt = "Bottom copper under the buck converter with the sense pair marked"
caption = "L19. B.Cu, seen from above. Yellow is the pair of sense tracks from the shunt R37 on its way to the amplifier. The box is U1 on the other side of the board, and L1 is to its left."
box = [7.0, 15.0, 40.0, 40.0]
layers = ["B.Cu", "Edge.Cuts"]
zones = false
marks = [{ nets = ["/ISNS"], refs = ["U1", "L1"], label = "ISNS sense track; boxes: U1 and L1" }, { nets = ["GND"], label = "ground, with its sense track" }]

[[step.figure]]
