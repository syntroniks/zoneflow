id = "k-dev-adc"
group = "kicad"
title = "Accept or reject: the ADC filter capacitors are 19 mm from their pins"
source = "Finding L18. Layout document, section 14, item 4"
findings = ["L18"]
minutes = 3
check = '''
C30 and C31 filter the two current-measurement lines into the ADC. The design wants them at the
module pins. They are 19 mm of track away. Read the argument and decide.
'''
why = '''
For what the capacitors are there to do, a 1.6 kHz filter and a charge reservoir for the ADC's
sampling capacitor, 19 mm of track is 9 nH and 56 milliohm and changes nothing. What the distance
does cost is radio-frequency pick-up at the pin itself, 2 cm from a transmitting antenna. The
reviewer could not put a number on that. It is a bench item: measure ADC noise with WiFi on.
'''
good = '''
You accept it for a prototype and note the bench item. The cure, if it shows, is in the pin map:
GPIO4 to 7 on the module's left side have room for a capacitor at the pin.
'''
bad = '''
You want the pin map changed before the first board. Mark Fail. That reopens the circuit, the
firmware pin definitions and the routing.
'''
how = '''
Find C30. Highlight `/ADC_LO`, then `/ADC_HI`. The module pads are 38 and 39, on the right-hand pad
row 1.5 mm from the board edge.
'''
kicad = { find = ["C30", "C31", "U4"], nets = ["/ADC_LO", "/ADC_HI"], layers = ["F.Cu", "B.Cu"], at = [109.6, 88.2] }
ibom = { ref = "C30" }

