[[step]]
id = "k-ka-n0"
group = "kicad"
title = "Two I2C conductors 0.2 mm from the node behind R29"
source = "Layout review, section 17, item 7, second place, and section 6"
findings = ["L22"]
minutes = 5
check = '''
Look at the node `KA_N0` between R29 and C22. A `QW_SDA` track passes 0.22 mm from the pad of C22,
and an `I2C0_SCL` via stands 0.23 mm from the node's track. Decide whether you accept them there.
'''
why = '''
To a solder bridge, `KA_N0` is the keep-alive net: only 220 ohm separate the two. The layout rule
keeps a list of nets 1 mm away from it. I2C lines are not on that list, because they move only
while firmware runs. The reviewer left both conductors in place and asked for the owner's decision.
A bridge here would need a second fault, a firmware that hangs while it still clocks I2C, to matter.
'''
good = '''
You see what the review describes and no more: one `QW_SDA` track beside pad 1 of C22, one
`I2C0_SCL` via beside the yellow track, both with a visible gap. Pass means "I have seen them and I
accept them for revision A".
'''
bad = '''
- **Any third net** that close to the yellow copper.
- **You do not accept it.** Mark Fail and say so in the note. The cure is to move the track and the
  via in `design/layout.py`, which means a new routing and a new review of it.
'''
how = '''
Find C22 and highlight net `/Failsafe/KA_N0`. Measure with the ruler tool (Ctrl+Shift+M) from the
edge of pad 1 of C22 to the nearest track.
'''
kicad = { find = ["C22", "R29"], nets = ["/Failsafe/KA_N0", "/QW_SDA", "/I2C0_SCL"], layers = ["F.Cu"], at = [104.9, 88.3] }
ibom = { ref = "C22" }

[[step.figure]]
id = "node"
alt = "Top copper at R29 and C22 with three nets marked"
caption = "F.Cu. Yellow is the node KA_N0 from R29 to C22. Cyan is QW_SDA. Pink is I2C0_SCL."
box = [96.0, 84.4, 107.2, 91.4]
layers = ["F.Cu", "Edge.Cuts"]
marks = [
  { nets = ["/Failsafe/KA_N0"], label = "KA_N0" },
  { nets = ["/QW_SDA"], label = "QW_SDA" },
  { nets = ["/I2C0_SCL"], label = "I2C0_SCL" },
]
pad_labels = ["R29", "C22"]
pad_label_mode = "number"
callouts = [
  { at = [105.75, 88.85], text = "QW_SDA, 0.22 mm from the pad", dx = -2.0, dy = 2.1, colour = "b" },
  { at = [99.78, 89.08], text = "I2C0_SCL via, 0.23 mm from the track", dx = 2.6, dy = 1.9, colour = "c" },
  { pad = "R29.2", text = "R29", dx = -0.4, dy = -1.6 },
  { pad = "C22.1", text = "C22", dx = 1.4, dy = -1.2 },
]

