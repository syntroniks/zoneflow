[[step]]
id = "k-q2-gate"
group = "kicad"
title = "Ground round the gate node of Q2"
source = "Layout review, section 17, item 7, third place"
findings = ["L22"]
minutes = 5
check = '''
Look at net `RLY_G2`: the gate of Q2, pad 1 of C50, pad 2 of D22 and one pad each of the bleed
resistors R14 and R90. Ground must surround it, and no supply rail may come within 1 mm.
'''
why = '''
This node holds the relay transistor on between keep-alive edges. It is high-impedance: 50 kohm to
ground. A leak from a supply rail, through flux or a whisker, charges it and holds the relay closed
with no keep-alive. The autorouter twice laid a `V_DRV` bar 0.86 mm from it, and the build stopped
both times.
'''
good = '''
- **The yellow node** is five pads and the short tracks between them, and nothing else.
- **Ground pour** fills the space round it.
- **The nearest rail** is `V_DRV` at the four right-hand pads of RN2, 1.48 mm away by both
  measurements. `3V3` is further.
'''
bad = '''
- **A cyan track or via** inside 1 mm of the yellow copper.
- **A test pad** on the yellow net. Layout rule 2 forbids one.
'''
how = '''
Find Q2 and highlight `/Expander/RLY_G2`. Then highlight `V_DRV` and `3V3` in turn and look for
copper of either near the node.
'''
kicad = { find = ["Q2", "D22", "C50"], nets = ["/Expander/RLY_G2", "V_DRV", "3V3"], layers = ["F.Cu"], at = [53.6, 72.2] }
ibom = { ref = "Q2" }

[[step.figure]]
id = "gate"
alt = "Top copper round Q2, C50 and D22 with the gate node and the supply rails marked"
caption = "F.Cu. Yellow is the gate node RLY_G2. Cyan is every supply rail in the picture: V_DRV at RN2 on the left, 3V3 elsewhere."
box = [40.5, 68.5, 58.5, 81.0]
layers = ["F.Cu", "F.Silkscreen", "Edge.Cuts"]
marks = [
  { nets = ["/Expander/RLY_G2"], label = "RLY_G2" },
  { nets = ["V_DRV", "3V3"], label = "V_DRV and 3V3" },
]
pad_labels = ["Q2", "D22", "C50", "RN2"]
callouts = [{ at = [44.3, 74.5], text = "nearest rail: 1.48 mm", dx = 0.6, dy = -4.6 }]

