[[step]]
id = "k-open-risks"
group = "kicad"
title = "Three risks the review left open: see each and accept it"
source = "Findings L19, L21 and L25"
findings = ["L19", "L21", "L25"]
minutes = 8
check = '''
The reviewer left three things as they are and gave a reason for each. Look at each place once.
Ordering the board means accepting all three.
'''
why = '''
None of these stops a prototype. Each is a place where the first measurements may disappoint, and
you should know where they are before the boards arrive.

- **L25, the PTC beside each triac.** The upper land of each PTC is part of the triac's heat copper.
  The triac heats it. At 85 °C the PTC holds 0.50 A, which is exactly the largest valve the
  specification allows. With three outputs on in a hot enclosure, a 0.5 A valve may trip its PTC.
  That closes the valve, which is the safe direction. Ordinary valves draw 0.2 to 0.3 A.
- **L19, the sense pair under the buck converter.** The two tracks that read the shunt run on B.Cu
  under U1 and beside the inductor, with the ground plane between. The reviewer estimates 0.2 mV of
  pick-up at 281 kHz before two filters.
- **L21, the encoder near the antenna.** The encoder's metal frame ends 12.5 mm from the antenna
  area. Espressif asks for 15 mm. Both positions are fixed by the enclosure.
'''
good = '''
Each place looks as described. Pass means you accept all three for revision A and will measure
them: PTC body temperature at 0.5 A, noise on the low current range, and radio range.
'''
bad = '''
You find one of them worse than described, or you do not accept one. Mark Fail and name it.
'''
how = '''
- **L25.** Find F101. The wide link between the PTC's upper pad and the triac tab is 5 mm. The
  current needs 1.2 mm.
- **L19.** Find U1, show B.Cu only, and look for two parallel tracks 0.6 mm apart passing under it.
- **L21.** Find SW3 and U4. The antenna is the part of the module beyond the top board edge.
'''
kicad = { find = ["F101", "U1", "SW3"], layers = ["F.Cu", "B.Cu"] }

[[step.figure]]
id = "ptc"
alt = "The PTC F101 and the triac Q101 on top copper with the tab net marked"
