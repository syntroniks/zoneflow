[[step]]
id = "k-screws"
group = "kicad"
title = "No copper under the two screw heads"
source = "Layout review, section 17, item 7, fifth place"
findings = ["L7", "L29"]
minutes = 4
check = '''
At the mounting holes C, at (4.5, 12), and D, at (109.5, 12), no track may be within 3 mm of the
centre on the top side.
'''
why = '''
These two holes take pan-head M3 screws from the top. A head is up to 5.6 mm across. If it bites
through the solder mask it joins whatever copper is under it to the screw. Before the review a USB
data line ran 0.44 mm from hole C, and the Qwiic supply under the head at hole D.
'''
good = '''
- **Inside the yellow circle**, 3 mm in radius, there is no red track and no via. Ground pour may be
  there.
- **Nearest top-side copper of a signal**, measured by the reviewer: 3.25 mm from the centre of hole
  C and 3.55 mm from hole D.
'''
bad = '''
- **Any track or via inside the circle** on F.Cu.
'''
how = '''
Find H3, then H4. Show F.Cu only. Use the ruler tool from the hole centre to the nearest track.
The bottom side does not matter here: the board rests on plastic bosses.
'''
kicad = { find = ["H3", "H4"], layers = ["F.Cu"], at = [4.5, 12.0] }

