[[step]]
id = "k-dev-j7"
group = "kicad"
title = "Accept or reject: the display bus is 61 to 72 mm long"
source = "Finding L17. Layout document, section 14, item 4"
findings = ["L17"]
minutes = 3
check = '''
The hardware design asks for "about 40 mm" of track from the module to the display connector J7.
The five bus lines are 61 to 72 mm. Read the argument and decide.
'''
why = '''
A long unterminated line rings. The reviewer's numbers: with the 21 mm tail of the panel the line is
about 100 mm, a delay of 0.6 ns one way. The bus runs at 15 MHz, a half-period of 33 ns. Clock and
data differ by 3 mm, which is 18 ps. The straight distance is 42 mm and the keep-alive net lies
between, so 40 mm of track cannot be had where the enclosure puts the two parts.
'''
good = '''
You accept 61 to 72 mm at 15 MHz. If the edges ring on the bench, the firmware can lower the pin
drive strength.
'''
bad = '''
You see the bus take a detour that the picture does not explain, or you want series resistors at
the module. Mark Fail and say which.
'''
how = '''
Highlight `/TFT_SCLK`. The bus leaves pads 18 to 22 at the bottom row of the module, goes under the
module on B.Cu and left to J7.
'''
kicad = { find = ["J7", "U4"], nets = ["/TFT_SCLK", "/TFT_MOSI", "/TFT_CS", "/TFT_DC", "/TFT_RST"], layers = ["F.Cu", "B.Cu"], at = [80.0, 90.0] }
ibom = { net = "/TFT_SCLK" }

[[step.figure]]
id = "bus"
alt = "The display bus from the module to J7 on both outer layers"
caption = "F.Cu over B.Cu, pours left out. Yellow is the five lines of the display bus. Cyan is the keep-alive net, which the bus has to go round."
box = [54.0, 76.0, 106.0, 102.0]
layers = ["B.Cu", "F.Cu", "Edge.Cuts"]
zones = false
marks = [
  { nets = ["/TFT_SCLK", "/TFT_MOSI", "/TFT_CS", "/TFT_DC", "/TFT_RST"], label = "display bus" },
  { nets = ["/KA"], label = "KA" },
]
callouts = [
