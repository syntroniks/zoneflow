[[step]]
id = "k-dev-r33"
group = "kicad"
title = "Accept or reject: R33 is 12 mm from the pin it should sit at"
source = "Finding L16. Layout document, section 14, item 4"
findings = ["L16"]
minutes = 3
check = '''
Fail-safe rule 1 says "put R33 at the module pin". R33 is at the corner of the module, 12.3 mm of
track and two vias from pad 10. Read the argument and decide.
'''
why = '''
R33 pulls the keep-alive net low when the processor does not drive it. The author could not put it
at the pin: the encoder is 0.1 mm away on that side. The reviewer argues that the place it has is
the better one. A break between the pin and R33 leaves both detectors on the pull-down, off. With
R33 at the pin the same break would leave both detectors floating. The 12 mm of track is 24
milliohm against 2200 ohm.
'''
good = '''
You agree that a pull-down at the far end of the track is at least as safe as one at the pin. The
reviewer would change the wording of the rule, not the board.
'''
bad = '''
You want R33 at the pin as the rule says. That needs the encoder or the module to move, and both
positions are fixed by the enclosure. Mark Fail and say what you want instead.
'''
how = '''
Nothing new to look at: this is the yellow track of the step before last, between pad 10 and R33.
The numbers are in the [layout review, section 13](doc:design/hardware-layout-review.md#13-mechanical-and-the-three-rules-not-met-as-written).
'''
kicad = { find = ["R33", "U4"], nets = ["/KA"], layers = ["F.Cu", "B.Cu"], at = [94.9, 87.6] }

[[step.figure]]
id = "r33"
alt = "Both outer layers between module pad 10 and R33"
caption = "F.Cu over B.Cu. Yellow is the keep-alive net. R33 is the lower left of the two resistors at the corner of the module, 12.3 mm of track from pad 10."
box = [89.5, 84.5, 101.5, 99.5]
layers = ["B.Cu", "F.Cu", "Edge.Cuts"]
zones = false
marks = [{ nets = ["/KA"], refs = ["R33"], label = "KA, and R33" }]
callouts = [{ pad = "U4.10", text = "pad 10", dx = -2.2, dy = 0 }]

