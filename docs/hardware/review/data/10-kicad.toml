id = "hole-b"
alt = "Top copper round mounting hole B"
caption = "Hole B, F.Cu with the ground pour in yellow. The circle is the 9 mm keep-out for parts. Red tracks inside it are the five nets."
box = [68.5, 99.5, 81.5, 110.8]
