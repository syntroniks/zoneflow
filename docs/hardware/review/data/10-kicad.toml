id = "hole-c"
alt = "Top copper round mounting hole C"
caption = "Hole C at the lower left, F.Cu with the ground pour in yellow. The circle is 3 mm from the centre."
box = [-1.5, 6.0, 11.5, 18.0]
layers = ["F.Cu", "Edge.Cuts"]
marks = [{ nets = ["GND"], label = "GND" }]
callouts = [{ at = [4.5, 12.0], text = "3 mm round hole C", dx = 3.6, dy = 4.6, ring = 3.0 }]
minimap = "none"

[[step.figure]]
id = "hole-d"
alt = "Top copper round mounting hole D"
caption = "Hole D at the lower right, F.Cu with the ground pour in yellow."
box = [103.0, 6.0, 116.0, 18.0]
layers = ["F.Cu", "Edge.Cuts"]
marks = [{ nets = ["GND"], label = "GND" }]
callouts = [{ at = [109.5, 12.0], text = "3 mm round hole D", dx = -3.6, dy = 4.6, ring = 3.0 }]
minimap = "none"

