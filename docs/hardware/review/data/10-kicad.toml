[[step]]
id = "k-patches"
group = "kicad"
title = "The 17 connections the autorouter could not close"
source = "Layout review, section 17, item 7, sixth place"
findings = ["L27", "L28"]
minutes = 15
check = '''
Open `output/reports/routing.md` beside the board. Under "Copper laid by the patch router" it lists
19 nets. Highlight each in turn and follow it from pin to pin.
'''
why = '''
A small maze router and the reviewer closed these by hand after the autorouter gave up. That router
keeps clearances and knows nothing else. Some results are long: `N_RAIN` is 156 mm with 13 vias.
Eleven of the nets pass under an obstacle on the 3.3 V plane and cut a slot in it. All are static or
slow signals, and the reviewer expects them to work. Nobody has looked at each one on a screen.
'''
good = '''
- **Each net is complete.** With the net highlighted, every pad of it is joined. DRC already says
  so. You are looking for what DRC cannot judge.
- **No detour beside a noisy part.** None of them runs along the inductor L1 or the switch node of
  U1, at the lower left.
- **On In2.Cu the slots are short.** The longest single slot is 21 mm. None is near the keep-alive
  net or under the current-sense pair.
'''
bad = '''
- **A patched net that runs beside `KA`** on any layer for more than a few millimetres.
- **A net you cannot follow** from one end to the other.
- **`SA_N`.** This is the inverting input of the current-sense amplifier, and the reviewer liked it
  least: 7.1 mm on In2.Cu under the amplifier with three vias. Look at it at U8. If it looks worse
  than described, say so.
'''
how = '''
The interactive BOM is quicker than KiCad for this. Open it in netlist mode, type the net name in
the filter and click the row. The picture below marks the whole of each net, not only the patched
piece.

The nets: `U0TXD`, `SA_N`, `SA_P`, `RLY_A`, `RLY_ON`, `I2C0_SDA`, `ISENSE_LO`, `STATUS_LED`,
`PGOOD`, `SENS_5V`, `SENS_PWR_EN`, `N_RAIN`, `T_RAIN`, `VB`, `ZD_MV_N`, `ZD_Z1_N`, `ZD_Z2_N`,
`ZD_Z8_N`, `V_DRV`.
'''
kicad = { nets = ["/Sensors/N_RAIN", "/SENS_PWR_EN", "/MCU/STATUS_LED", "/Expander/RLY_A", "/ZD_Z8_N", "/I2C0_SDA", "/CurrentSense/SA_N"], layers = ["F.Cu", "In2.Cu", "B.Cu"] }
ibom = { net = "/Sensors/N_RAIN" }

[[step.figure]]
id = "all"
alt = "The whole board with the 19 patched nets marked on the outer layers"
caption = "F.Cu over B.Cu, pours left out. Yellow is every net that has patched copper. Click to enlarge."
box = [-2, -4, 116, 118]
layers = ["B.Cu", "F.Cu", "Edge.Cuts"]
zones = false
minimap = "none"
marks = [{ label = "nets with patched copper", nets = [
  "/Connectors/U0TXD", "/CurrentSense/SA_N", "/CurrentSense/SA_P", "/Expander/RLY_A", "/Expander/RLY_ON",
  "/I2C0_SDA", "/ISENSE_LO", "/MCU/STATUS_LED", "/PGOOD", "/SENS_5V", "/SENS_PWR_EN", "/Sensors/N_RAIN",
  "/T_RAIN", "/VB", "/ZD_MV_N", "/ZD_Z1_N", "/ZD_Z2_N", "/ZD_Z8_N", "V_DRV",
] }]

[[step.figure]]
id = "plane"
alt = "Inner layer 2 of the whole board with the slots of patched nets marked"
caption = "In2.Cu. Orange is the 3.3 V plane and, at the bottom, the shunt plane and the copies of the valve lanes. Yellow is the eleven patched nets that cut slots in the plane."
box = [-2, -4, 116, 118]
layers = ["In2.Cu", "Edge.Cuts"]
minimap = "none"
marks = [{ label = "patched nets on this layer", nets = [
  "/Connectors/U0TXD", "/CurrentSense/SA_N", "/Expander/RLY_A", "/I2C0_SDA", "/MCU/STATUS_LED", "/SENS_5V",
  "/Sensors/N_RAIN", "/VB", "/ZD_MV_N", "/ZD_Z2_N", "/ZD_Z8_N",
] }]

