[[step]]
id = "k-u1-vias"
group = "kicad"
title = "Six vias under the buck converter"
source = "Layout review, section 17, item 7, fourth place"
findings = ["L2", "L8"]
minutes = 3
check = '''
Count the vias in the exposed pad of U1, and check that pin 1, GND, joins that pad.
'''
why = '''
As first laid out the pad had no via and hung on four thin spokes. The converter loses 0.2 to 0.5 W
through that pad. Without vias it runs hot, and its ground pin has a long way to the plane, which
makes the 5 V rail noisy. TI's data sheet asks for both in section 7.4.1.
'''
good = '''
- **Six vias** in the pad, in two columns of three.
- **A wide yellow link** from pad 1, at the lower right, to the exposed pad.
- **A gap of 0.4 mm** between the ground pour and pads 2 and 8. It was 0.2 mm before finding L8.
'''
bad = '''
- **Fewer than six vias**, or a pad joined to the pour by spokes only.
'''
how = '''
Find U1. Show F.Cu only. Click a via in the pad: the properties must say net `GND`, hole 0.3 mm.
'''
kicad = { find = ["U1"], nets = ["GND"], layers = ["F.Cu"], at = [21.5, 33.0] }
ibom = { ref = "U1" }

[[step.figure]]
id = "pad"
alt = "Top copper at the buck converter U1 with ground marked"
caption = "F.Cu at U1. Yellow is ground. The six black dots in the centre pad are the vias."
box = [16.0, 29.0, 27.0, 38.0]
layers = ["F.Cu", "Edge.Cuts"]
marks = [{ nets = ["GND"], label = "GND" }]
pad_labels = ["U1"]
callouts = [{ at = [21.5, 33.0], text = "six vias in the pad", dx = 0, dy = -4.3, ring = 1.9 }]

