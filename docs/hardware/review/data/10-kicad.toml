[[step]]
id = "k-ka-pin10"
group = "kicad"
title = "The keep-alive track from module pin 10 to R33 and R29"
source = "Layout review, section 17, item 7, first place"
findings = ["L22"]
minutes = 6
check = '''
Follow net `KA` from pad 10 of the module U4 down to the resistors R33 and R29. Beside it, for 1 mm
on each side, there must be nothing but ground, on F.Cu and on B.Cu.
'''
why = '''
The firmware toggles this net to say that it is alive. Both fail-safe detectors listen to it. A
solder bridge or a flux track from a neighbour that toggles by itself can imitate a live firmware,
and then a crashed controller leaves a valve open. Review A2 found exactly that fault on the
earlier pin and moved the net here.
'''
good = '''
- **On F.Cu** a 2 mm stub leaves pad 10 under the module and ends in a via.
- **On B.Cu** the track runs down the inside of the module's left pad row to a via between R33 and
  R29 at (96.5, 87.6).
- **Beside the track** only the ground pour. The nearest other track is more than 1 mm away. Both
  the author's check and the reviewer's own script measured 1.03 to 1.04 mm as the smallest
  distance on the same layer.
- **The two pads beside pad 10**, `ENC_B` above and `BTN_BACK` below, are 0.37 mm from it. That is
  the module's pad pitch and cannot be more.
'''
bad = '''
- **A track or a via of another net** inside the 1 mm strip on either side.
- **A break in the ground pour** beside the track, with another net showing through.
'''
how = '''
Find U4, zoom to its left pad row, and highlight net `/KA`. Look once with only F.Cu shown and once
with only B.Cu shown. The machine check of this rule is `output/reports/layout-rules.md`.
'''
kicad = { find = ["U4", "R33", "R29"], nets = ["/KA"], layers = ["F.Cu", "B.Cu"], at = [94.25, 97.08] }
ibom = { net = "/KA" }

[[step.figure]]
id = "back"
alt = "Bottom copper under the module's left pad row with the keep-alive net marked"
caption = "B.Cu, seen from above. Yellow is the keep-alive net. It comes down from the via at pad 10 to the via between R33 and R29, then leaves to the left towards detector B."
box = [89.5, 84.5, 101.5, 99.5]
layers = ["B.Cu", "Edge.Cuts"]
marks = [{ nets = ["/KA"], label = "KA" }]
callouts = [
  { pad = "U4.10", text = "module pad 10 is above here, on F.Cu", dx = -1.2, dy = 1.8 },
  { at = [96.45, 87.6], text = "via between R33 and R29", dx = -2.2, dy = -1.7 },
]

[[step.figure]]
id = "front"
alt = "Top copper at module pad 10, R33 and R29"
caption = "F.Cu. Yellow is the keep-alive net: pad 10 with its stub, and the pads of R33 and R29. The pads above and below pad 10 are ENC_B and BTN_BACK."
box = [89.5, 84.5, 101.5, 99.5]
layers = ["F.Cu", "F.Silkscreen", "Edge.Cuts"]
marks = [{ nets = ["/KA"], label = "KA" }]
pad_labels = ["U4", "R33", "R29"]

