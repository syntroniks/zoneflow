[[step]]
id = "k-hole-b"
group = "kicad"
title = "Five tracks under the display carrier's leg at hole B"
source = "Finding L30"
findings = ["L30"]
minutes = 3
check = '''
Look at the copper round hole B at (75, 106). Five autorouted nets pass under the plastic leg of
the display carrier, the nearest 0.47 mm from the wall of the hole. Decide whether you accept that.
'''
why = '''
The leg is plastic and the copper is under solder mask, so nothing shorts. The risk is mechanical: a
screw driven hard into a leg that sits on tracks can crack the mask and, in time, a track. The
reviewer left it, because the contract's keep-out here is for parts and bare copper only.
'''
good = '''
Tracks pass inside the circle and none touches the hole. No pad, no via with an open top and no bare
copper is inside the circle. Pass means you accept tracks under a plastic leg.
'''
bad = '''
- **A pad or a test point** inside the circle.
- **A track that touches the edge of the hole.**
'''
how = '''
Find H2. Show F.Cu only. The circle on the picture is 4.5 mm in radius, the contract's keep-out for
parts at this hole.
'''
kicad = { find = ["H2"], layers = ["F.Cu"], at = [75.0, 106.0] }

