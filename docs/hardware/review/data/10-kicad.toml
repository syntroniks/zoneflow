[[step]]
id = "k-silk"
group = "kicad"
title = "The terminal labels as the installer reads them"
source = "Layout review, section 17, item 6"
findings = ["L10", "L15"]
minutes = 5
check = '''
Read the top silkscreen along the terminal edge. Each of the twenty terminals must have its own
label directly behind it, and each label must read as one word.
'''
why = '''
The installer wires the valves by these labels. As first laid out, `FLOW` and `GND` stood 0.1 mm
apart and read as one word, and six designators lay beyond the board edge. A label behind the wrong
terminal puts 24 VAC on a sensor input.
'''
good = '''
- **Left to right:** `24V~` `24V~`, then `COM` `COM` `MV` `Z1` `Z2` `Z3` `Z4`, then `Z5` `Z6` `Z7`
  `Z8`, then `5V` `FLOW` `GND` `RAIN` `GND` `AUX` `GND`.
- **Each label** stands above the pin it names, with a clear gap to its neighbours.
- **The ground symbol** is right of the second `24V~`.
- **`F4 3A T` and `F1 3A T`** stand above the two fuse holders.
- **Elsewhere:** `USB`, `QWIIC`, `RESET`, `BOOT`, `BACK`, `HOME`, `CR2032` and `+` at the cell.
'''
bad = '''
- **Two labels that touch** or read as one word.
- **A label between two pins**, so that you cannot say which pin it names.
- **Text cut by the board edge.**
'''
how = '''
Show F.Silkscreen, F.Cu pads and Edge.Cuts. Or open [the top render](out:zoneflow-a-top.png), which
shows the silkscreen on the finished board. In JLCPCB's Gerber viewer you see the same layer again
later.

Nine designators are hidden because no place was free: TP9, TP11, TP13, TP14, TP22, TP27, TP28,
TP29 and U1. That is finding L15 and is accepted. The interactive BOM finds them.
'''
