# Steps done in the KiCad window.

[[step]]
id = "k-open"
group = "kicad"
title = "Open the board and run the design rule check yourself"
source = "Layout review, section 17, last paragraph: \"a look at the board in the KiCad window, which neither the author nor I had\""
minutes = 10
check = '''
Open the project in KiCad 10. Confirm that the board opens without a warning, that it looks like the
picture, and that KiCad's own design rule check finds nothing.
'''
why = '''
Every check so far ran through `kicad-cli` on a build machine. If your KiCad reads the files
differently, for example because a library is missing, you would be reviewing another board than the
one that was checked. This step ties what you see to what the programs saw.
'''
good = '''
- **The board opens** with no message about missing libraries or a newer file version.
- **Size.** The outline measures 114.0 x 110.0 mm.
- **DRC.** Inspect, Design Rules Checker, with "Refill all zones before performing DRC" and "Test for
  parity between PCB and schematic" ticked. Result: 0 errors, 0 warnings, 0 unconnected items, 0
  schematic parity problems.
'''
bad = '''
- **Any DRC error or warning.** Note its text and position and stop. The build claims there is none.
- **A message about a missing footprint library or symbol.** Your checkout is incomplete.
- **Zones that look different after refill.** If KiCad asks to save after DRC, do not save. Note it.
'''
how = '''
1. Open `hardware/zoneflow-a/zoneflow-a.kicad_pro`, then the PCB editor.
2. Make KiCad show the coordinates this walkthrough uses. Preferences, PCB Editor, Origins & Axes.
   Set the display origin to the drill/place file origin and the Y axis to increase upwards. The
   bottom-left corner of the board is then (0, 0), as on every picture here. I took these menu
   names from KiCad's manual and did not open the window myself.
3. If you leave the default, every step also gives the page coordinates KiCad shows out of the box.
4. To find a part, press Ctrl+F and type its designator. To follow a net, select the net
   highlighter in the right toolbar and click a track of that net.
5. Do not save the board. The files in the repository are generated, and the next build overwrites
   them.
'''
kicad = { layers = ["F.Cu", "In1.Cu", "In2.Cu", "B.Cu"] }

[[step.figure]]
id = "board"
alt = "The whole board: top copper, top silkscreen and outline"
caption = "What the PCB editor shows with the front layers on: top copper in red, silkscreen in pale yellow. The module at the top right reaches beyond the board edge."
box = [-2, -4, 116, 118]
layers = ["F.Cu", "F.Silkscreen", "Edge.Cuts"]
minimap = "none"

# ---------------------------------------------------------------------------------------------------

[[step]]
id = "k-valve"
group = "kicad"
title = "Look at one valve output on all four layers"
source = "Layout document, section 14, item 1. Findings L6 and L14"
findings = ["L6", "L14"]
minutes = 8
check = '''
Follow the output of zone 1 from its terminal to its triac, on each copper layer in turn. The other
eight columns are copies of this one.
'''
why = '''
This is the only path on the board that carries valve current, and the path a shorted valve wire
heats. The review found two vias where four are needed and doubled them. If the path necks down
somewhere, a short in the garden burns the board before the fuse acts.
'''
good = '''
- **B.Cu, the fan-out.** A 0.9 mm track runs from pin 4 of J2 sideways to the column at x = 49.95.
  It ends in a row of four vias, 0.8 mm apart.
- **In2.Cu.** The same track again, on the same path, and under the triac a wide plane on net
  `ISNS`.
- **F.Cu.** From the four vias a 1.2 mm track into the lower pad of the PTC F101. A 5 mm wide link
  from the upper PTC pad to the triac tab. Four small vias in the tab land, two larger ones beside
  the PTC pad.
- **B.Cu, the island.** A filled area 6.6 x 23 mm under the triac, on the same net as the tab.
'''
bad = '''
- **Fewer than four vias** at the end of the fan-out lane.
- **A neck.** Any piece of this path visibly narrower than the rest.
- **A thermal-relief spoke pattern** on the PTC pads or the tab. They must join their copper solid.
'''
how = '''
Find Q101 with Ctrl+F. Show one copper layer at a time in the Appearance panel. Highlight net
`/Z1/T2`, then net `/OUT_Z1`.

**L14, for the day the boards arrive.** The four vias in the tab land are open on the top and
covered by mask on the bottom, so solder runs in. The review left them. Look at the tab joints of
the first boards.
'''
kicad = { find = ["Q101", "F101"], nets = ["/Z1/T2", "/OUT_Z1"], layers = ["F.Cu", "In2.Cu", "B.Cu"], at = [49.95, 24.0] }
ibom = { ref = "Q101" }

[[step.figure]]
id = "front"
alt = "Top copper of the zone 1 output column"
caption = "F.Cu. Yellow is the output net from the four vias up to the PTC. Cyan is the tab net T2, from the PTC to the triac tab."
box = [45.5, 7.5, 54.5, 37.5]
layers = ["F.Cu", "Edge.Cuts"]
pad_labels = ["Q101", "F101"]
marks = [{ nets = ["/OUT_Z1"], label = "OUT_Z1" }, { nets = ["/Z1/T2"], label = "T2 of zone 1" }]
callouts = [
  { at = [50.4, 14.6], text = "four vias, 0.3 mm", dx = -3.4, dy = -2.6, ring = 1.6 },
  { at = [51.48, 30.86], text = "four vias in the tab land", dx = 2.0, dy = 2.6 },
]

[[step.figure]]
id = "back"
alt = "Bottom copper of the zone 1 output column, seen from above"
caption = "B.Cu, seen from above as KiCad shows it. Yellow is the fan-out lane from the terminal. Cyan is the heat island under the triac."
box = [38.0, 3.0, 56.0, 37.5]
layers = ["B.Cu", "Edge.Cuts"]
marks = [{ nets = ["/OUT_Z1"], label = "OUT_Z1" }, { nets = ["/Z1/T2"], label = "T2 of zone 1" }]

[[step.figure]]
id = "inner"
alt = "Inner layer 2 under the zone 1 output column"
caption = "In2.Cu. Yellow is the copy of the fan-out lane. Cyan is the shunt return plane, net ISNS, under all nine triacs."
box = [38.0, 3.0, 56.0, 37.5]
layers = ["In2.Cu", "Edge.Cuts"]
marks = [{ nets = ["/OUT_Z1"], label = "OUT_Z1" }, { nets = ["/ISNS"], label = "ISNS" }]

