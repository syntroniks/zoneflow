# The 30 findings of the layout review, as cards. Condensed from the table in
# docs/design/hardware-layout-review.md, section 2. "check" says what guards the fix on every build.
# "images" are the review's own pictures, in docs/design/hardware-layout-review/.

[[finding]]
id = "L1"
severity = "Blocking"
status = "fixed"
where = "Placement files"
found = "26 of 307 placements were wrong against JLCPCB's own footprints: nine triacs and nine opto-triacs a quarter turn off, both USB ESD arrays a quarter turn off, the display connector a quarter turn off and 1.6 mm from its lands, the module 3.6 mm from its lands, the USB-C receptacle 1.5 mm, the three resistor arrays half a turn round."
action = "The correction table `hardware/rules/jlcpcb-cpl-rotations.csv` is rewritten per part number, with offsets."
check = "`make cpl-check` places JLCPCB's library footprint for every part as the file says and compares pads: 312 of 312 and 267 of 267 fit. It needs the network and is run on demand, not on every build."
section = "5-the-placement-file-against-jlcpcbs-library"
images = [{ file = "placement.png", caption = "The review's picture. Top row: JLCPCB's footprint in red, placed as the first file said, over the board's pads in grey. Bottom row: the corrected file." }]
steps = ["o-commands", "o-prev-triacs", "o-prev-optos", "o-prev-big3", "o-prev-rest"]

[[finding]]
id = "L2"
severity = "Major"
status = "fixed"
where = "U1 at (21.5, 33.0)"
found = "The exposed pad of the buck converter had no via and no track. Four thermal spokes 0.4 mm wide joined it to a sliver of the top pour. The GND pin was not tied to it."
action = "Six vias under the pad, the pin tied to it, a second via at the pin and at C2."
check = "The vias are written in `design/layout.py`, and DRC with schematic parity checks their net. No program counts them: that is the step below."
section = "8-buck-converter-and-supplies"
images = [{ file = "u1.png", caption = "The review's picture. Left as first laid out, right now. Ground in yellow." }]
steps = ["k-u1-vias"]

[[finding]]
id = "L3"
severity = "Major"
status = "fixed"
where = "3.3 V, the whole logic area"
found = "The 3.3 V pour on In2.Cu was in 21 pieces and the one on B.Cu in 15, cut by 2.4 m of autorouted track. C25 was 7.5 mm from the supply pin it serves, on 23 mm of 0.2 mm track."
action = "In2.Cu is one plane of 71 cm² that the autorouter may not use. The regulator U3 reaches it through five vias where it had one. C25 is 2.4 mm from its pin."
check = "The build fails if an autorouted track is on In2.Cu or any track is on In1.Cu."
section = "9-planes-clearances-heat-signals-antenna"
images = [{ file = "in2.png", caption = "The review's picture of In2.Cu. Left as first laid out, right now." }]
steps = ["k-patches", "o-layers", "s-u3"]

[[finding]]
id = "L4"
severity = "Major"
status = "fixed"
where = "The 5 V chain, x 2 to 24, y 26 to 55"
found = "Buck output to OR-ing diode to regulator, and the USB feed, were autorouted at 0.4 mm, part of it on 17 um inner copper. The feedback divider sensed 6 mm down the load track."
action = "Routed by hand on the outer layers, 0.55 to 1.0 mm wide. The divider senses at the pad of D25 on its own track."
check = "Hand-routed copper is written in `design/layout.py` and locked. DRC checks its width against the net class."
section = "7-power-and-ac-paths"
images = [{ file = "v5.png", caption = "The review's picture. V_BUCK, V5 and VBUS in yellow. Left as first laid out, right now." }]

[[finding]]
id = "L5"
severity = "Major"
status = "fixed"
where = "Nets VIN_MON and RLY_B_RB"
found = "The supply monitor line was 120 mm through ten vias, laid by a maze router. The relay read-back, 50 kohm behind it, was autorouted."
action = "`VIN_MON` by hand: 137 mm, four vias, on B.Cu under the 3.3 V plane. `RLY_B_RB` by hand: 71 mm, two vias."
check = "Hand-routed copper is written in `design/layout.py`. `output/reports/routing.md` lists what the autorouter and the patch router laid, and these nets are not in it."
section = "7-power-and-ac-paths"
images = [{ file = "vinmon.png", caption = "The review's picture. VIN_MON in yellow on the whole board. Left as first laid out, right now." }]

[[finding]]
id = "L6"
severity = "Major"
status = "fixed"
where = "The nine output columns"
found = "Two 0.3 mm vias carried a shorted output. With JLCPCB's published plating, 18 um on average, they heat by 131 K in the case where only the PTC ends the fault."
action = "Four vias per output, 33 K, and three at each A1 lead, 40 K."
check = "The vias are written once for all nine columns in `design/layout.py`. No program repeats the heating calculation."
section = "7-power-and-ac-paths"
images = [{ file = "outvias.png", caption = "The review's picture. Output Z1 in yellow below its PTC. Left as first laid out, right now." }]
steps = ["k-valve", "o-ask"]

[[finding]]
id = "L7"
severity = "Major"
status = "fixed"
where = "Holes C at (4.5, 12) and D at (109.5, 12)"
found = "Autorouted copper lay under the heads of the two pan-head board screws: `USB_DM` 0.44 mm from hole C, and the Qwiic supply and a via of the Qwiic clock under the head at hole D."
action = "The autorouter and the patch router are kept out of a 6 mm square at each hole on F.Cu. Nearest top-side copper now: 3.25 mm from the centre of hole C, 3.55 mm from hole D."
check = "The keep-out squares are in `design/board.toml`, and both routers obey them."
section = "13-mechanical-and-the-three-rules-not-met-as-written"
images = [
  { file = "screw-before.png", caption = "The review's picture, as first laid out: USB_DM in yellow at hole C and the Qwiic supply at hole D." },
  { file = "screw-after.png", caption = "The same two places now." },
]
steps = ["k-screws"]

[[finding]]
id = "L8"
severity = "Major"
status = "fixed"
where = "DRC itself"
found = "Two clearances were not what the layout document said. KiCad's footprint for U1 carries its own 0.2 mm, which outranks the net class, so the ground pour stood 0.2 mm from the 45 V input pin and the switch node where the class asks 0.4 mm. And a shared rule gave every pair of surface-mount pads 0.15 mm, whatever their nets."
action = "The builder removes clearance overrides from footprints and prints which. The general rule is gone, and the one pair it hid, the solder jumper JP1, has a rule of its own."
check = "Every build: the builder strips footprint overrides before DRC runs."
section = "10-the-checks-themselves"
images = [{ file = "u1.png", caption = "The review's picture of U1. On the right the pour stands 0.4 mm from pins 2 and 8, where it was 0.2 mm." }]
steps = ["k-u1-vias"]

[[finding]]
id = "L9"
severity = "Major"
status = "fixed"
where = "The ground pad of the module U4"
found = "Twelve holes of 0.2 mm, from KiCad's stock module footprint. The rules file recorded 0.2 mm as free of surcharge. JLCPCB's help article of 2026-11-10 says the standard hole is 0.3 mm."
action = "0.3 mm holes in 0.7 mm lands."
check = "Every build: DRC fails on any hole under 0.3 mm."
section = "11-manufacturability-at-jlcpcb"
steps = ["o-commands", "o-options"]

[[finding.figure]]
id = "pad"
alt = "The ground pad of the module with its vias"
caption = "As it is now, drawn from the board file: the nine ground lands under the module with their twelve 0.3 mm vias. There is no picture of the earlier state."
box = [98.0, 97.2, 105.0, 104.4]
