[[step]]
id = "s-bat54s"
group = "sheets"
title = "The six BAT54S diode pairs"
source = "Layout review, section 4: checked \"from memory\". Ordering page, assembly step 4"
findings = ["L23"]
minutes = 4
check = '''
On each of D7, D9, D15, D16, D17 and D22, pad 1 is the anode end of the pair, pad 2 the cathode end
and pad 3 the point between the two diodes.
'''
why = '''
The part number changed after the review, to a cheaper maker, and JLCPCB's library symbol for the
new number draws the pair as two diodes with a common anode. The maker's sheet does not. Four of
these six are input clamps: pad 1 on ground, pad 2 on 3.3 V, pad 3 on the signal. The other two,
D7 and D22, are the charge pumps of the two keep-alive detectors. A pump fitted as a common-anode
pair does not pump, and that detector never enables.
'''
good = '''
- **Clamps D9, D15, D16, D17:** pad 1 `GND`, pad 2 `3V3`, pad 3 the signal.
- **Pump D7:** pad 1 `GND`, pad 2 `KA_N2`, pad 3 `KA_N1`.
- **Pump D22:** pad 1 `GND`, pad 2 `RLY_G2`, pad 3 `KB_N1`.
- **In the sheet** the BAT54S drawing has one diode pointing from pin 1 to pin 3 and one from pin
  3 to pin 2.
'''
bad = '''
A sheet whose BAT54S drawing has both arrows pointing away from pin 3, or both towards it. That is
a BAT54A or a BAT54C and the wrong part.
'''
how = '''
Find each of the six. In JLCPCB's preview, go by the pads and not by the symbol.
'''
fact = '''
**hongjiacheng BAT54 thru BAT54S**, the copy LCSC serves for [C7420333](https://www.lcsc.com/datasheet/C7420333.pdf),
"Function Diagram", fourth drawing, BAT54S: pin 1 anode, pin 3 the common point, pin 2 cathode.
The marking code for the BAT54S is KL4.
'''
kicad = { find = ["D7", "D9", "D15", "D16", "D17", "D22"], layers = ["F.Cu", "F.Fab"], at = [101.5, 86.1] }
ibom = { ref = "D7" }

