[[step]]
id = "s-u7"
group = "sheets"
title = "U7, the fail-safe logic 74HC132"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23"]
minutes = 3
check = '''
Compare the net on each of the 14 pads of U7 with Nexperia's pin list.
'''
why = '''
U7 is the over-current latch and the gate that makes `DRV_EN`. Its supply on the wrong pad means no
valve ever turns on. An output on an input pad can mean drive that never turns off.
'''
good = '''
- **Pin 14** is `3V3` and **pin 7** is `GND`.
- **Outputs:** pin 3 `FAULT`, pin 6 `FAULT_N`, pin 8 `DRV_EN_N`, pin 11 `DRV_EN`.
- **Every other pin** is an input and carries one of `OC_TRIP_N`, `FAULT_N`, `FAULT`, `KA_OK`,
  `DRV_EN_N`.
'''
bad = '''
A net that is an output in the list above on a pin the sheet calls an input, or the reverse.
'''
how = '''
Find U7. Pin 1 is at the upper left.
'''
fact = '''
**Nexperia 74HC132; 74HCT132, rev. 8**, the copy LCSC serves for [C5601](https://www.lcsc.com/datasheet/C5601.pdf),
table 2:

| Pins | Function |
|---|---|
| 1, 4, 9, 12 | Inputs A of gates 1 to 4 |
| 2, 5, 10, 13 | Inputs B of gates 1 to 4 |
| 3, 6, 8, 11 | Outputs Y of gates 1 to 4 |
| 7 | GND |
| 14 | VCC |
'''
kicad = { find = ["U7"], layers = ["F.Cu", "F.Fab"], at = [20.0, 74.0] }
ibom = { ref = "U7" }

[[step.figure]]
id = "pads"
alt = "U7 with the net on each of its 14 pads"
caption = "U7 on F.Cu. Pin 1 is at the upper left."
