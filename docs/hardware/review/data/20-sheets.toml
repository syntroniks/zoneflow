[[step]]
id = "s-u11"
group = "sheets"
title = "U11, the sensor supply switch TPS2553"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23"]
minutes = 3
check = '''
Compare the net on each pad of U11 with the pin list from TI's sheet.
'''
why = '''
U11 switches and limits the 5 V supply for flow meters. With input and output swapped, the limit
does not work and a shorted sensor cable loads the 5 V rail directly.
'''
good = '''
Pad 1 `V_BUCK` is IN. Pad 2 `GND`. Pad 3 `SENS_PWR_EN` is EN. Pad 4 `SENS_FLT_N` is FAULT. Pad 5
`SP_ILIM` is ILIM. Pad 6 `SP_OUT` is OUT. Pad 1 is at the upper left, where the fabrication outline
has its cut corner.
'''
bad = '''
Any pad whose net does not fit the pin's function, or pin 1 at another corner than the sheet's
drawing shows.
'''
how = '''
Find U11. Open the sheet at the pin table and at the package drawing for the DBV package.
'''
fact = '''
**TI SLVS841G**, [TPS2552, TPS2553](https://www.ti.com/lit/ds/symlink/tps2553.pdf), table 5-1, column
TPS2553 SOT-23:

| Pin | Name |
|---|---|
| 1 | IN |
| 2 | GND |
| 3 | EN, active high |
| 4 | FAULT, open drain, active low |
| 5 | ILIM |
| 6 | OUT |
'''
kicad = { find = ["U11"], layers = ["F.Cu", "F.Fab"], at = [56.8, 65.5] }
ibom = { ref = "U11" }

[[step.figure]]
id = "pads"
alt = "U11 with the net on each of its six pads"
caption = "U11 on F.Cu with the fabrication outline. Each pad shows its number and its net."
around = ["U11"]
