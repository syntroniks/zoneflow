group = "sheets"
title = "Q3, the P-channel MOSFET AO3401A"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23"]
minutes = 2
check = '''
Pad 1 of Q3 must be the gate, pad 2 the source and pad 3 the drain.
'''
why = '''
Q3 switches the supply of the opto-triac LEDs, `V_DRV`. It is the gate-drive half of the fail-safe.
With source and drain exchanged its body diode feeds `V_DRV` all the time, and removing drive no
longer turns the valves off.
'''
