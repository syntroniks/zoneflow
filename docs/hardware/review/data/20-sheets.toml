[[step]]
id = "s-u6"
group = "sheets"
title = "U6, the quad comparator LM2901"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23"]
minutes = 4
check = '''
Compare the net on each of the 14 pads of U6 with TI's pin list: the supply pins first, then that
each output sits with its own pair of inputs.
'''
why = '''
U6 holds keep-alive detector A, the over-current window and the zero-cross detector. A comparator
wired to another comparator's inputs gives a fail-safe that never trips, or one that always does.
'''
good = '''
- **Pin 3** is `V5` and **pin 12** is `GND`.
- **Pin 1** `KA_OK` is the output for the inputs on pins 6 and 7, `KA_REF` and `KA_INP`.
- **Pin 2** `OC_TRIP_N` is the output for pins 4 and 5, `OC_CMP` and `VH`.
- **Pin 14** `OC_TRIP_N` is the output for pins 8 and 9, `VL` and `OC_CMP`.
- **Pin 13** `AC_ZC` is the output for pins 10 and 11, `VL` and `ZC_DIV`.
'''
bad = '''
Supply or ground on another pad, or an output grouped with the wrong pair of inputs.
'''
how = '''
Find U6. The part is turned a quarter: pin 1 is at the upper right of the picture.
'''
fact = '''
**TI SLCS006Z**, [LM2901](https://www.ti.com/lit/ds/symlink/lm2901.pdf), table 5-1, column D:

| Pin | Name | Pin | Name |
|---|---|---|---|
| 1 | Output for inputs 6 and 7 | 8 | IN3 minus |
| 2 | Output for inputs 4 and 5 | 9 | IN3 plus |
| 3 | VCC | 10 | IN4 minus |
| 4 | Minus input | 11 | IN4 plus |
| 5 | Plus input | 12 | GND |
| 6 | Minus input | 13 | OUT4, for inputs 10 and 11 |
| 7 | Plus input | 14 | OUT3, for inputs 8 and 9 |

TI's note to the table says makers name channels 1 and 2 differently and that the pinout is the
same. So this list gives the pairing and leaves the two names out.
'''
kicad = { find = ["U6"], layers = ["F.Cu", "F.Fab"], at = [108.0, 78.9] }
ibom = { ref = "U6" }

[[step.figure]]
id = "pads"
alt = "U6 with the net on each of its 14 pads"
caption = "U6 on F.Cu. Pin 1 is at the upper right: the part is turned a quarter."
around = ["U6"]
margin = 1.4
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["U6"]

