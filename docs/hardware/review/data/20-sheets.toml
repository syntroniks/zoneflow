SDA and SCL exchanged, or the supply on another pad than 8.
'''
how = '''
Find U10. Pin 1 is at the upper left.
'''
fact = '''
**NXP PCF8563, rev. 11.1**, [product data sheet](https://www.nxp.com/docs/en/data-sheet/PCF8563.pdf),
table 3, column SO8:

| Pin | Name |
|---|---|
| 1 | OSCI |
| 2 | OSCO |
| 3 | INT |
| 4 | VSS |
| 5 | SDA |
| 6 | SCL |
| 7 | CLKOUT |
| 8 | VDD |
'''
kicad = { find = ["U10", "Y1"], layers = ["F.Cu", "F.Fab"], at = [66.0, 72.0] }
ibom = { ref = "U10" }

