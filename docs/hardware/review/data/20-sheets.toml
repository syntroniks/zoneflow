[[step]]
id = "s-u3"
group = "sheets"
title = "U3, the 3.3 V regulator LDL1117"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23", "L3"]
minutes = 3
check = '''
Compare the net on each pad of U3 with ST's pin list. The tab is the output, not ground.
'''
why = '''
Some regulators in this package have ground on the tab. This one has its output there, and
the board joins the tab to the 3.3 V plane. If the footprint had the tab as ground, the rail would be shorted
to the plane through five vias.
'''
good = '''
Pad 1, the upper lead, is `GND`. Pad 2, the middle lead, and the tab are both `3V3`. Pad 3, the
lower lead, is `V5`.
'''
bad = '''
The tab on any net but `3V3`. Input and ground exchanged.
'''
how = '''
Find U3. The three leads are at the left and the tab at the right. ST draws the part with the leads
down and pin 1 at the left. Turn that drawing a quarter clockwise to match the board.
'''
fact = '''
**ST DocID030319 rev 3**, LDL1117, the copy LCSC serves for [C435835](https://www.lcsc.com/datasheet/C435835.pdf),
figure 2 and table 1:

| Pin | Name |
|---|---|
| 1 | GND |
| 2 | VOUT |
| 3 | VIN |
| Tab | "The tab is connected to VOUT" |
'''
kicad = { find = ["U3"], nets = ["3V3"], layers = ["F.Cu", "F.Fab"], at = [14.5, 50.1] }
ibom = { ref = "U3" }

[[step.figure]]
id = "pads"
alt = "U3 with the net on each pad"
caption = "U3 on F.Cu. Yellow is the 3.3 V rail: the middle lead, the tab and the bar that joins them."
around = ["U3"]
margin = 2.0
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
marks = [{ nets = ["3V3"], label = "3V3" }]
pad_labels = ["U3"]

