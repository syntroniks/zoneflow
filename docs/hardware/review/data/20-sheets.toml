Pad 1 `DRV_EN_N` is the gate. Pad 2 `3V3` is the source. Pad 3 `V_DRV`, alone on the right, is the
drain.
'''
bad = '''
`3V3` on pad 3 and `V_DRV` on pad 2.
'''
how = '''
Find Q3. Same drawing as for the AO3400A: drain alone on one side.
'''
fact = '''
**Alpha & Omega AO3401A**, the copy LCSC serves for [C15127](https://www.lcsc.com/datasheet/C15127.pdf),
front page, "SOT23 Top View": D alone on one side, G and S on the other. For a P-channel part
that switches a positive supply, the source is on the supply and the drain on the load.
'''
kicad = { find = ["Q3"], layers = ["F.Cu", "F.Fab"], at = [13.6, 76.5] }
ibom = { ref = "Q3" }

