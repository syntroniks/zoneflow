# Steps done with a maker's datasheet open. The pin lists under "fact" were read from the sheets
# named there on 2026-11-11. The nets on the pictures are read from the board file by the build.

[[step]]
id = "s-d25"
group = "sheets"
title = "D25, the 6 V clamp: which pad is the cathode"
source = "Finding L23, \"one not verified\". Layout review, section 4, row D25, and section 16"
findings = ["L23"]
minutes = 4
files = ["hardware/rules/jlcpcb-cpl-rotations.csv"]
remedies = [
  { id = "rotation-row", text = "The netlist is right and the part lies the wrong way in the placement: add a row for C83270 to `hardware/rules/jlcpcb-cpl-rotations.csv`." },
]
check = '''
D25 is a one-way clamp, SMBJ6.0A. Its cathode must be on `V_BUCK` and its anode on ground. Confirm
that pad 1 is on `V_BUCK`, and that the maker marks the cathode with a band.
'''
why = '''
D25 limits the 5 V rail to under 10 V if the buck converter fails short. Fitted backwards it is a
forward diode from ground to the 5 V rail: the rail sits at 0.7 V, the fuse F5 opens at the first
power-up and the board never starts. This is the one polarity the reviewer could not check, because
JLCPCB's library footprint for this part does not name its pads.
'''
good = '''
- **Pad 1**, the left pad, is on `V_BUCK`. Pad 2 is on `GND`.
- **The silkscreen and the outline on the fabrication layer** show the bar and the diode symbol's
  bar at the left, at pad 1.
'''
bad = '''
- **Pad 1 on `GND`.** The part would be the wrong way round in the netlist.
- **A datasheet for a bidirectional part**, SMBJ6.0CA. That part has no band and no polarity. The
  BOM must say SMBJ6.0A.
'''
how = '''
Find D25. Click each pad and read its net. Then look at the same part in JLCPCB's placement preview:
that is its own step in the last group.
'''
fact = '''
**Littelfuse SMBJ series data sheet**, the copy LCSC serves for [C83270](https://www.lcsc.com/datasheet/C83270.pdf),
under "Physical Specifications", Polarity: "Uni-directional products are denoted with a cathode
band". SMBJ6.0A is the uni-directional part. In KiCad's `D_SMB` footprint pad 1 is the cathode.
'''
kicad = { find = ["D25"], nets = ["V_BUCK"], layers = ["F.Cu", "F.Silkscreen", "F.Fab"], at = [12.9, 36.75] }
ibom = { ref = "D25" }

[[step.figure]]
id = "pads"
alt = "D25 with its two pads and their nets"
caption = "D25 on F.Cu with the silkscreen and the fabrication outline. Yellow is the 5 V rail V_BUCK. Pad 1, at the left, is the cathode."
around = ["D25"]
margin = 2.6
layers = ["F.Cu", "F.Silkscreen", "F.Fab", "Edge.Cuts"]
marks = [{ nets = ["V_BUCK"], label = "V_BUCK" }]
pad_labels = ["D25"]
callouts = [{ pad = "D25.1", text = "cathode: the band goes here", dx = -0.6, dy = 3.3 }]

