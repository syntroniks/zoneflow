[[step]]
id = "s-u5"
group = "sheets"
title = "U5, the I/O expander TCA9539"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23"]
minutes = 5
check = '''
Compare the net on each of the 24 pads of U5 with TI's pin list. Look hardest at pins 3, 12 and 24.
'''
why = '''
Every valve is switched through this chip, and its RESET pin is how the fail-safe turns all valves
off at once. If RESET were on the wrong pad, a crashed controller could leave a valve on.
'''
good = '''
- **Pin 3, RESET,** is on `DRV_EN`.
- **Pin 12** is `GND` and **pin 24** is `3V3`.
- **Pins 22 and 23** are `I2C0_SCL` and `I2C0_SDA`. **Pin 1, INT,** is `EXP_INT_N`.
- **Pins 2 and 21,** the address inputs A1 and A0, are both on `GND`. That gives I2C address 0x74.
- **Port pins:** 4 to 8 are `ZD_Z1_N` to `ZD_Z4_N` and `ZD_MV_N`, 9 is `RLY_ON`, 13 to 16 are
  `ZD_Z5_N` to `ZD_Z8_N`, 17 is `VARIANT_N`, 18 is `SENS_FLT_N`. Pins 10, 11, 19 and 20 are the
  spare port pins `P06`, `P07`, `P16`, `P17`.
'''
bad = '''
Supply, ground or RESET on another pad than the sheet says. A port pin on the wrong pad would also
be wrong, but the firmware's pin map decides that, not the sheet.
'''
how = '''
Find U5. Pin 1 is at the upper left of the picture.
'''
fact = '''
**TI SCPS202C**, [TCA9539](https://www.ti.com/lit/ds/symlink/tca9539.pdf), "Pin Functions", column
TSSOP (PW):

| Pin | Name | Pin | Name |
|---|---|---|---|
| 1 | INT | 13 to 20 | P10 to P17 |
| 2 | A1 | 21 | A0 |
| 3 | RESET | 22 | SCL |
| 4 to 11 | P00 to P07 | 23 | SDA |
| 12 | GND | 24 | VCC |
'''
kicad = { find = ["U5"], layers = ["F.Cu", "F.Fab"], at = [35.0, 72.5] }
ibom = { ref = "U5" }

[[step.figure]]
id = "pads"
alt = "U5 with the net on each of its 24 pads"
caption = "U5 on F.Cu. Pin 1 is at the upper left. Click to enlarge and read the nets."
around = ["U5"]
margin = 1.2
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["U5"]
minimap = "none"

