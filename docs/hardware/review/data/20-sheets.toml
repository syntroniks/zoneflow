[[step]]
id = "s-ao3400"
group = "sheets"
title = "Q1, Q2 and Q4, the N-channel MOSFET AO3400A"
source = "Layout review, section 4: nine makers' sheets not opened"
findings = ["L23"]
minutes = 3
check = '''
On each of the three transistors, pad 1 must be the gate, pad 2 the source and pad 3, alone on its
side, the drain.
'''
why = '''
Q1 and Q2 are in series in the relay coil's ground path. Q2 is the relay half of the fail-safe. With
gate and source exchanged the body diode conducts and the relay cannot be released.
'''
good = '''
- **Q2:** pad 1 `RLY_G2`, pad 2 `GND`, pad 3 `RLY_B`.
- **Q1:** pad 1 `RLY_G1`, pad 2 `RLY_B`, pad 3 `RLY_A`.
- **Q4,** the backlight switch at (54.5, 96.0): pad 1 `BL_G`, pad 2 `GND`, pad 3 `TFT_LEDK`.
- **On each,** the single pad on the right is pad 3.
'''
bad = '''
A gate net on pad 2 or 3.
'''
how = '''
Find Q1, Q2 and Q4 in turn. The sheet has a drawing with letters and no pin numbers. Seen from
above and going anticlockwise it reads gate, source, drain, and the dot on the body is beside the
gate. A SOT-23 footprint counts 1, 2, 3 the same way round.
'''
fact = '''
**Alpha & Omega AO3400A**, the copy LCSC serves for [C20917](https://www.lcsc.com/datasheet/C20917.pdf),
front page, "SOT23 Top View": D alone on one side, G and S on the other.
'''
kicad = { find = ["Q1", "Q2", "Q4"], layers = ["F.Cu", "F.Fab"], at = [53.6, 72.2] }
ibom = { ref = "Q2" }

[[step.figure]]
id = "pads"
alt = "Q1 and Q2 with the net on each pad"
caption = "Q1 at the left and Q2 at the right, on F.Cu. Pad 3, the drain, is the single pad on the right of each."
around = ["Q1", "Q2"]
margin = 1.3
layers = ["F.Cu", "F.Fab", "Edge.Cuts"]
zones = false
pad_labels = ["Q1", "Q2"]
marks = [{ refs = ["Q1", "Q2"], label = "Q1, Q2" }]

