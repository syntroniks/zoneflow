<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 650" width="1060" height="650" font-family="Helvetica, Arial, sans-serif" font-size="12" role="img" aria-labelledby="t d">
<title id="t">ZoneFlow rev A block diagram</title>
<desc id="d">24 VAC enters through two fuses and a surge clamp, is half-wave rectified and stepped down to 5.3 V and 3.3 V. USB-C also feeds the 5 V bus. The ESP32-S3 drives nine triac outputs through an I2C expander and opto-triacs. A relay feeds the valve common. Two keep-alive detectors and an over-current latch can remove drive without firmware. A shunt measures total valve current. Sensor inputs, an RTC, the display, the encoder and buttons, and a Qwiic connector complete the board.</desc>
