<text x="230.0" y="61.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">2 fuses</text>
<text x="230.0" y="76.7" text-anchor="middle" font-size="10.5" fill="#52606d">F1, F4, 3 A time-lag</text>
<rect x="170" y="110" width="120" height="44" rx="5" fill="#fff7ed" stroke="#1f2933" stroke-width="1.3"/>
<text x="230.0" y="128.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Surge clamp</text>
<text x="230.0" y="143.7" text-anchor="middle" font-size="10.5" fill="#52606d">TVS D1</text>
<rect x="30" y="130" width="120" height="50" rx="5" fill="#fff7ed" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="151.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">24 VAC present</text>
<text x="90.0" y="166.7" text-anchor="middle" font-size="10.5" fill="#52606d">zero-cross signal</text>
<rect x="170" y="174" width="120" height="50" rx="5" fill="#fff7ed" stroke="#1f2933" stroke-width="1.3"/>
<text x="230.0" y="195.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Half-wave rectifier</text>
<text x="230.0" y="210.7" text-anchor="middle" font-size="10.5" fill="#52606d">and 470 uF</text>
<rect x="170" y="244" width="120" height="50" rx="5" fill="#fff7ed" stroke="#1f2933" stroke-width="1.3"/>
<text x="230.0" y="265.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">Buck converter</text>
<text x="230.0" y="280.7" text-anchor="middle" font-size="10.5" fill="#52606d">100 V rated, 5.3 V</text>
<rect x="30" y="244" width="120" height="50" rx="5" fill="#fff7ed" stroke="#1f2933" stroke-width="1.3"/>
<text x="90.0" y="265.7" text-anchor="middle" font-size="12" font-weight="bold" fill="#1f2933">USB-C</text>
<text x="90.0" y="280.7" text-anchor="middle" font-size="10.5" fill="#52606d">flash, logs, power</text>
<rect x="100" y="314" width="120" height="44" rx="5" fill="#fff7ed" stroke="#1f2933" stroke-width="1.3"/>
