# Part table for ZoneFlow rev A: what each part number is in KiCad.
#
# hardware/netlist.yaml names every component, its value, package and LCSC
# number and the net on every pin. It does not name a KiCad symbol or
# footprint. This table does, once per part number. The key is the LCSC
# number, or "value|package" for the four kinds of part that have none.
#
#   value      what the schematic shows. The netlist's own text goes into the
#              hidden field "Spec" and is checked word for word.
#   package    must equal the netlist's package, so that a package change
#              there cannot keep an old footprint here.
#   pins       netlist pin key -> symbol pin number(s). Not needed where the
#              key starts with the number ("3 EN/UVLO").
#   unconnected  symbol pins that the netlist does not list and that stay open.
#   in_bom, on_board  false for pads on the PCB and for the display panel.
#
# The footprint behind each name is checked against the maker's drawing in
# footprints.md. The build fails if a netlist part is missing here, and the
# netlist parity check fails if a symbol pin is not covered.

# Builds: which netlist variants each one fits. "base" is the schematic as
# drawn, the 8-zone board. Every other name is a KiCad variant.
[builds]
base = ["all", "8"]
4-zone = ["all"]

# Parts of the board that the design netlist does not list, because they
# have no pins: the four mounting holes of hardware/mechanical.yaml. The
# value is the hole's letter and position there. The footprint's courtyard
# is the contract's component keep-out, 9 mm at A and B and 7 mm at C and D.
[mechanical.H1]
value = "A: 5.5, 105"
symbol = "Mechanical:MountingHole"
footprint = "ZoneFlow:MountingHole_3.4mm_M3_Keepout9mm"

[mechanical.H2]
value = "B: 75, 106"
symbol = "Mechanical:MountingHole"
footprint = "ZoneFlow:MountingHole_3.4mm_M3_Keepout9mm"

[mechanical.H3]
value = "C: 4.5, 12"
symbol = "Mechanical:MountingHole"
footprint = "ZoneFlow:MountingHole_3.4mm_M3_Keepout7mm"

[mechanical.H4]
value = "D: 109.5, 12"
symbol = "Mechanical:MountingHole"
footprint = "ZoneFlow:MountingHole_3.4mm_M3_Keepout7mm"

