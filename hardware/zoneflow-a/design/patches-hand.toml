# The autorouter joined the four V_DRV pads of RN2 with a bar beside them, 0.86 mm from the gate
# node of Q2. Layout rule 3 wants every rail 1 mm from that node, and the build failed on it, as it
# did on the first routing. The bar is taken out and the pads are joined through their own centres:
# the rail is then 1.48 mm from the node.
[[unroute]]
net = "V_DRV"
box = [43.4, 73.2, 44.9, 75.9]

[[patch]]
layer = "F.Cu"
net = "V_DRV"
width = 0.4
stay = true
points = [[43.5, 73.3], [43.5, 75.7]]

# I2C0_SDA to the clock chip U10. DRC names the nearest two pieces of the net, and the patch router
# joins exactly those: here they lie on opposite sides of the keep-alive net, where the top side is
# closed to crossings and In2.Cu and B.Cu are closed too. Pin 23 of U5 is on the same side of the
# keep-alive as U10, behind the resistor array RN2 and its vias, which shut the two outer layers.
# The short way under RN2 on In2.Cu would run 9 mm within 2 mm of the keep-alive. This one goes
# round the south instead: 58 mm, eight vias, 13.5 mm on In2.Cu in two pieces that pass under the
# ADC lines, and nowhere within 3 mm of the keep-alive on that layer.
[[patch]]
layer = "F.Cu"
net = "/I2C0_SDA"
width = 0.2
via = [0.6, 0.3]
stay = true
points = [[68.45, 70.09], [69.55, 68.99], {via = [71.5, 68.99]}]

