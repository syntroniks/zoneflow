# Connections of the stored routing that hwflow.patchroute could not close by itself, closed by
# hand with the same search (layout review, section 9). They belong to the stored routing like the
# tracks of patches.toml: after a new autorouter run, delete everything below the header and run
# `make patches`; write new ones only for what it then leaves open.
#
# The autorouter boxed four pads in on F.Cu with no place for a via beside them: the test pad
# TP15, pin 2 of the amplifier U8, the pull-up R96 and pin 8 of the expander U5. Each [[unroute]]
# takes out one piece of autorouted copper that stood in the way; the tracks that follow lay it
# again beside the connection it made room for.

# ZD_Z1_N ran on B.Cu under the middle of TP15. 0.4 mm further up there is room under the pad for
# a via of VB between it and ZD_Z2_N. A test pad is not soldered, so a via may stand in it.
[[unroute]]
net = "/ZD_Z1_N"
box = [24.7, 75.3, 26.65, 75.8]

# SA_P left pin 3 of U8 on a diagonal that passed under pin 2 and shut it in. It goes straight down
# first now. SA_N cannot cross the Kelvin ground sense on F.Cu and the V_BUCK branch on B.Cu, both
# laid by hand between the pin rows of U8, so 7.1 mm of it are on In2.Cu.
[[unroute]]
net = "/CurrentSense/SA_P"
box = [32.7, 57.9, 35.8, 60.2]

# RLY_ON went west from pin 9 of U5 through the one gap between R96 and R27, to a via, and came
# back east on B.Cu. ZD_MV_N needs that gap to reach R96. RLY_ON now drops to B.Cu beside the pin.
[[unroute]]
net = "/Expander/RLY_ON"
box = [25.0, 68.3, 31.2, 71.2]

[[patch]]
layer = "B.Cu"
net = "/ZD_Z1_N"
width = 0.2
stay = true
points = [[24.8053, 75.5102], [25.195, 75.9], [26.45, 75.9], [26.75, 75.7]]

[[patch]]
layer = "F.Cu"
net = "/VB"
width = 0.2
via = [0.6, 0.3]
stay = true
points = [[25.1, 75.0], {via = [25.6, 75.275]}]

[[patch]]
layer = "F.Cu"
net = "/ZD_MV_N"
width = 0.2
stay = true
points = [[32.1375, 71.525], [30.55, 71.525], [30.15, 71.125], [30.15, 70.8], [29.95, 70.6], [27.775, 70.6], [27.575, 70.8], [27.575, 71.4]]

[[patch]]
