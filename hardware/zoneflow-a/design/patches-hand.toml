# The autorouter joined the four V_DRV pads of RN2 with a bar beside them, 0.86 mm from the gate
# node of Q2. Layout rule 3 wants every rail 1 mm from that node, and the build failed on it, as it
# did on the first routing. The bar is taken out and the pads are joined through their own centres:
# the rail is then 1.48 mm from the node.
[[unroute]]
net = "V_DRV"
box = [43.4, 73.2, 44.9, 75.9]

[[patch]]
layer = "F.Cu"
net = "V_DRV"
width = 0.4
stay = true
points = [[43.5, 73.3], [43.5, 75.7]]

# I2C0_SDA to the clock chip U10. DRC names the nearest two pieces of the net, and the patch router
# joins exactly those: here they lie on opposite sides of the keep-alive net, where the top side is
# closed to crossings and In2.Cu and B.Cu are closed 1.1 mm either side. The pull-up R21 is on the
# same side of the keep-alive as U10, behind the resistor array RN2 and its vias, which shut the
# two outer layers. So the track goes from U10 to R21 and passes under RN2 on In2.Cu: 16.8 mm
# there, 1.7 mm from the keep-alive in plan view and outside its keep-out.
[[patch]]
layer = "F.Cu"
net = "/I2C0_SDA"
width = 0.2
via = [0.6, 0.3]
stay = true
points = [[68.45, 70.09], [67.5, 70.09], {via = [65.1, 72.49]}]

[[patch]]
layer = "B.Cu"
net = "/I2C0_SDA"
width = 0.2
via = [0.6, 0.3]
stay = true
points = [[65.1, 72.49], [64.5, 73.09], {via = [55.1, 73.09]}]

[[patch]]
layer = "In2.Cu"
net = "/I2C0_SDA"
width = 0.2
via = [0.6, 0.3]
stay = true
points = [[55.1, 73.09], [51.55, 76.64], [42.6, 76.64], {via = [40.6, 78.64]}]

[[patch]]
layer = "F.Cu"
net = "/I2C0_SDA"
width = 0.2
stay = true
points = [[40.6, 78.64], [40, 78.64], [39, 77.64], [39, 77.59]]

