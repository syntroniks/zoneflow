# Component heights for the mechanical check, by footprint. Millimetres above the board.
#
# The check compares these with the height zones of hardware/mechanical.yaml. A footprint that
# is used on the board and missing here fails the build. Parts that the contract places itself
# (connectors, encoder, buttons, LEDs, module, cell holder, C1, K1, fuse holders) are not checked
# against zones and need no entry.
#
# src says where the number is from:
#   "sheet"     read from the maker's data sheet for the ordering code in the BOM
#   "contract"  taken from the heights list of mechanical.yaml, which names its own source
#   "package"   the usual maximum of that package. NOT read from the maker's sheet for this part.
#               None of these is within 2 mm of the limit of the zone it is in.
# height = 0 marks a footprint with no body: pads only.

