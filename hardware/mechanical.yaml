  # LEDs. One square light pipe stands 0.7 mm above each. All on y = 42.
  - {ref: D6, name: Status LED, side: top, x: 12.0, y: 42.0, rot: 0, label: "",
     model: [{box: [0, 0, 1.6, 0.8, 0, 0.8]}]}
