# ZoneFlow rev A: mechanical contract between the enclosure and the PCB layout.
#
# Status: paper design, revision 2 of the contract, 2026-11-10. No board
# exists and no part has been printed. Every dimension is from a datasheet or
# drawing named in `sources`, or is a design decision made here. `unconfirmed`
# lists what must be checked against a physical sample before the board is
# ordered. `changes` at the end lists what moved since revision 1.
#
# This file is the source. `enclosure/tools/gen_params.py` turns it into
# `enclosure/board_params.scad`, which the enclosure model and the placeholder
# board model both include. Change a number here, run `make` in `enclosure/`,
# and the interference check tells you whether the enclosure still clears it.
# The reasoning is in docs/design/mechanical.md.

schema: 1
revision: 2
units: mm

frame:
  origin: >-
    Bottom-left corner of the board outline, seen from the component (top)
    side with the terminal blocks along the bottom edge.
  x: to the right, along the terminal-block edge
  y: up, away from the terminal blocks, towards the antenna
  z: >-
    Out of the top side, towards the user. z = 0 is the top copper surface.
    The bottom surface is at z = -thickness.
  rotation: >-
    Degrees counter-clockwise seen from the top side. Each part states what
    its 0 degree orientation is.
  mounted: The board is vertical on a wall, +y up, top side facing the room.

board:
  # 114 x 110 mm rectangle, 125.4 cm2. Width is set by the bottom-edge
  # connectors. Height was 100 in revision 1 and grew by 10 for the 346
  # components of the reviewed circuit (docs/design/mechanical.md section 3).
  outline: [[0, 0], [114, 0], [114, 110], [0, 110]]
  corner_radius_max: 1.5
  thickness: 1.6
  thickness_tol: 0.16        # 10 %, JLCPCB standard; enclosure allows 0.2
  outline_tol: 0.2           # enclosure keeps 0.4 to 1.1 mm from every edge
  edge_keepout: 1.0          # no component body within this of any edge,
                             # except the edge connectors listed below
  layers: 4                  # the area estimate assumes four
  top_side: every SMT part, the edge connectors, encoder, switches, LEDs, module
  bottom_side: >-
    No SMT. Only the through-hole parts C1 and K1, inserted from the bottom,
    and the pin ends of the terminal headers. See `assembly`.

# How the board is put together. This decides which side parts are on.
assembly:
  smt: >-
    One SMT side, the top. The assembly house places and reflows it. Nothing
    on the bottom side is machine-placed.
  through_hole:
    - {refs: "J1 J2 J3 J4", inserted_from: top, soldered_on: bottom}
    - {refs: "K1", inserted_from: bottom, soldered_on: top}
    - {refs: "C1", inserted_from: bottom, soldered_on: top,
       note: "Lying on its side, leads bent 90 degrees"}
  who: >-
    All six through-hole parts are soldered by hand in one step after SMT:
    either by the assembly house as hand-soldered through-hole parts, or by
    the builder at final assembly, when the display and the cell go in. Ask
    the assembler which it will do for parts on the side opposite the SMT.
  c1: >-
    C1 is the through-hole Rubycon 63PX470MEFC12.5X20, not the SMD Lelon can.
    The Lelon part would be the only SMT part on the bottom and would need a
    second SMT side. The Rubycon part is 21.5 mm long at most and does not
    fit standing, so it lies on its side. Two ribs in the enclosure base hold
    it against the board. A dot of neutral-cure silicone between the can and
    the board is recommended and is not relied on.
  for_layout: >-
    Keep 2.5 mm around the top-side pads of C1 and K1 free of parts taller
    than 1.5 mm, so that an iron reaches them after reflow. Mark the C1
    outline and polarity on the bottom silkscreen.

# Heights of the enclosure surfaces the board looks at. z as in `frame`.
stack:
  fascia_outer_z: 12.5       # front face of the product over the board
  fascia_inner_z: 10.5       # inside surface of the fascia (2.0 mm skin)
  cover_inner_z: 12.5        # inside of the wiring cover, over the plugs
  bottom_clearance: 18.0     # free height below the bottom surface
  panel_front_z: 11.0        # display glass; 0.5 mm under the bezel lip
  panel_back_z: 8.95         # panel_front_z - 2.05
  panel_pad: 0.1             # tape between panel and carrier deck
  deck_thickness: 1.2        # display carrier deck under the panel
  header_face_y: -2.0        # mating face of J1 to J4, beyond the board edge
  top_gap: 10.0              # free space above the top board edge (antenna)

holes:
  # M3 clearance holes, 3.4 mm, not plated or plated and isolated. The 0.2 mm
  # of radial play is how the enclosure takes up a board that is 0.2 mm off.
  # keepout diameters: no component and no exposed copper other than an
  # optional ground ring under a screw head.
  - {id: A, x: 5.5, y: 105.0, d: 3.4, kind: screw, top_keepout: 9.0, bottom_keepout: 10.0,
     note: "Display carrier leg and board screw, M3x16 countersunk from the top"}
  - {id: B, x: 75.0, y: 106.0, d: 3.4, kind: screw, top_keepout: 9.0, bottom_keepout: 10.0,
     note: "Display carrier leg and board screw, M3x16 countersunk from the top"}
  - {id: C, x: 4.5, y: 12.0, d: 3.4, kind: screw, top_keepout: 7.0, bottom_keepout: 10.0,
     note: "Board screw, M3x6 pan head"}
  - {id: D, x: 109.5, y: 12.0, d: 3.4, kind: screw, top_keepout: 7.0, bottom_keepout: 10.0,
     note: "Board screw, M3x6 pan head"}
  # No hole: the carrier rests on the top surface here.
  - {id: E, x: 5.0, y: 71.0, d: 0, kind: foot, top_keepout: 6.0, bottom_keepout: 0,
     note: "Display carrier foot, 4 x 4 mm, rests on the board"}
  - {id: F, x: 75.0, y: 70.0, d: 0, kind: foot, top_keepout: 6.0, bottom_keepout: 0,
     note: "Display carrier foot, 4 x 4 mm, rests on the board"}
  # No hole: a post in the base supports the board under the encoder.
  - {id: G, x: 86.0, y: 74.0, d: 0, kind: post, top_keepout: 0, bottom_keepout: 7.0,
     note: "Support post under the board, takes encoder push force"}
  # There is deliberately no screw in the top-right corner: a steel screw
  # there would sit inside the 15 mm antenna clearance.
  # A, B, E and F are placed so that a 2.4 inch panel fits between them
  # later. See `display_options`.

# Mechanically constrained parts. x, y is the part's reference point in board
# coordinates. `model` lists the boxes and cylinders that the placeholder
# board model and the interference check use, as offsets from x, y with the
# part already in its final orientation:
#   box: [dx, dy, size_x, size_y, z0, z1]   cyl: [dx, dy, diameter, z0, z1]
# z0 and z1 are heights above the surface the part is mounted on, so a
# bottom-side part also counts upward from 0.
parts:
  - ref: DS1
    name: HS20HS072RX 2.0 inch TFT panel
    side: top
    mount: >-
      Not on the board. The panel lies on the printed display carrier, which
      stands on the board at A, B, E and F. Ribs inside the fascia locate it;
      nothing clamps the glass. It is used in landscape with the FPC edge
      towards +x.
    x: 35.0                  # centre of the active area
    y: 88.0
    rot: 90                  # 0 = datasheet front view, FPC at the bottom
    active_area: [40.8, 30.6]          # src: display
    outline: [51.8, 36.2]              # src: display, tolerance 0.2
    outline_origin: [11.96, 69.9]      # lower-left corner of the outline
    aa_to_edge_opposite_fpc: 2.64      # src: display
    aa_to_long_edge: 2.8               # src: display
    viewing_area: [43.94, 33.6]        # src: display note 8, recommended window
    thickness: 2.05                    # src: display, tolerance 0.05
    window_margin: 0.6                 # bezel opening = active area + this per side
    fpc_tail_length: 20.7              # src: display, tolerance 0.5, beyond the outline
    fpc_tail_width: 6.5                # src: display
    fpc_tail_centre_y: 88.43           # 69.9 + 15.28 + 6.5 / 2
    fpc_root_y: [77.2, 98.65]          # wide part of the FPC, first 10 mm; scaled from the drawing
    fpc_exit_below_front: 1.3          # scaled from the side view, not dimensioned
    model:
      - box: [2.86, 0, 51.8, 36.2, 8.95, 11.0]
  - ref: DS1-FPC
    name: Space swept by the display FPC as it folds under the panel
    side: top
    x: 67.0
    y: 88.0
    rot: 0
    model:
      - box: [0, -0.075, 6.4, 21.65, 4.0, 10.0]    # wide root and bend
      - box: [-0.5, 0.43, 7.4, 6.9, 0.6, 4.0]      # narrow tail down to J7
  - ref: J7
    name: FPC connector 12-way 0.5 mm, bottom contact, flip lock, FPC-05F-12PH20
    side: top
    x: 60.44                 # centre of the body
    y: 88.43                 # centre of the FPC slot = tail centre
    rot: 0                   # 0 = FPC enters from +x, travelling in -x
    fpc_entry_x: 63.0        # mouth of the connector
    pin1_y: 85.68            # pad 1 is the contact nearest y = 0; pad 12 is at 91.18
    height: 2.0              # src: hw-design 16.4, from the XUNPU drawing
    body: [5.12, 10.4]       # src: hw-design 16.4: (12 - 1) x 0.5 + 4.9 long, 5.12 deep
    model:
      - box: [0, 0, 5.12, 10.4, 0, 2.0]
  - ref: SW3
    name: EC11J1525402 encoder with push switch
    side: top
    x: 85.0                  # shaft axis
    y: 88.0
    rot: 0                   # 0 = terminals A, C, B towards -y; any multiple of 90 is acceptable
    shaft_top_z: 24.5        # src: encoder, 4.5 body + 20 shaft
    bushing_d: 8.975         # src: encoder
    bushing_top_z: 14.5      # src: encoder, 4.5 + 10
    shaft_d: 5.975           # src: encoder
    shaft_flat_across: 4.45  # src: encoder
    shaft_flat_length: 7.0   # src: encoder
    push_travel: 1.5         # src: encoder, tolerance 0.5
    model:
      - box: [0, 0, 15.0, 13.5, 0, 4.5]
      - box: [0, 0, 8.5, 18.0, 0, 1.2]
      - cyl: [0, 0, 8.975, 4.5, 14.5]
      - cyl: [0, 0, 5.975, 14.5, 24.5]
  - ref: SW4
    name: Back button, TS-1102S-C-M-B, 10 mm actuator
    side: top
    x: 22.0
    y: 61.5
    rot: 0                   # 0 = terminals along x
    actuator_top_z: 10.0     # src: tact, height code M
    travel: 0.25             # src: tact
    model:
      - box: [0, 0, 8.6, 6.0, 0, 3.3]
      - cyl: [0, 0, 3.5, 3.3, 10.0]
  - ref: SW5
    name: Home / Manual button, TS-1102S-C-M-B, 10 mm actuator
    side: top
    x: 48.0
    y: 61.5
    rot: 0
    actuator_top_z: 10.0
