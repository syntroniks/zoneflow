  - ref: J3
    name: KF2EDGR-3.81-4P header, zones 5 to 8
    side: top
    x: 64.01
    y: 2.6
    rot: 0
    poles: 4
    pin1: [58.295, 5.9]
    labels: ["5", "6", "7", "8"]
    model:
      - box: [0, 0, 16.04, 9.2, 0, 7.0]
  - ref: J4
    name: KF2EDGR-3.81-7P header, 5V FLOW GND RAIN GND AUX GND
    side: top
    x: 89.765
    y: 2.6
    rot: 0
    poles: 7
    pin1: [78.335, 5.9]
    labels: ["5V", "FLOW", "GND", "RAIN", "GND", "AUX", "GND"]
    model:
      - box: [0, 0, 27.47, 9.2, 0, 7.0]
  - ref: J6
    name: JST SH 4-way side entry, Qwiic
    side: top
    x: 109.25
    y: 1.625                 # body centre; mouth 0.5 mm beyond the board edge
    rot: 0                   # 0 = mouth towards -y
    model:
