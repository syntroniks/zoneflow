# Maximum component height above each surface, per region. A region listed
# later overrides one listed earlier where they overlap, and the lowest limit
# wins between the general zone and any specific zone. `max_height: 0` means
# no component. The parts in `parts` are exempt inside their own footprint.
zones:
  - {id: T_GENERAL, side: top, rect: [0, 0, 114, 100], max_height: 9.0,
     why: "Fascia inner surface at 10.5, less 1.5 for print tolerance"}
  - {id: T_CARRIER, side: top, rect: [0, 57.5, 74.5, 100], max_height: 6.5,
     why: "Display carrier deck and arms, underside at 7.65"}
  - {id: T_FPC, side: top, rect: [58, 66.5, 72, 89.5], max_height: 0,
     why: "The display FPC folds through here. J7 only."}
  - {id: T_BTN_BACK, side: top, rect: [11.5, 45, 32.5, 58], max_height: 7.0,
     why: "Flange of the button cap, underside at 8.0, moves 0.25"}
  - {id: T_BTN_HOME, side: top, rect: [37.5, 45, 58.5, 58], max_height: 7.0,
     why: "Flange of the button cap"}
  - {id: T_LIGHTPIPE, side: top, rect: [9.3, 39.3, 104.7, 44.7], max_height: 1.0,
     why: "Light pipes end at z = 1.5 over each LED; their rail runs the length"}
  - {id: T_ANTENNA, side: top, rect: [79, 85, 114, 100], max_height: 3.5,
     why: "Within 15 mm of the antenna: nothing tall, no metal body other than U4"}
  - {id: T_EDGE_LEFT, side: top, rect: [0, 0, 1.0, 100], max_height: 0,
     why: "Fascia lip overhangs the board edge from z = 0.6"}
  - {id: T_EDGE_RIGHT, side: top, rect: [113, 0, 114, 100], max_height: 0,
     why: "Fascia lip overhangs the board edge from z = 0.6"}
  - {id: B_GENERAL, side: bottom, rect: [0, 0, 114, 100], max_height: 17.0,
     why: "18.0 mm to the back wall. C1 is 17.0 at its maximum."}
  - {id: B_KEYHOLE_L, side: bottom, rect: [10.5, 70, 28.5, 94], max_height: 10.0,
     why: "Pocket for the wall screw head, top 11.3 below the board"}
  - {id: B_KEYHOLE_R, side: bottom, rect: [85.5, 70, 103.5, 94], max_height: 10.0,
     why: "Pocket for the wall screw head"}
  - {id: B_ANTENNA, side: bottom, rect: [79, 85, 114, 100], max_height: 3.5,
     why: "Within 15 mm of the antenna"}

antenna:
  module: U4
  rule: >-
    The module sits in the top-right corner with its 18 x 6 mm antenna area
    wholly beyond the top board edge, feed point towards the corner. That is
    position 3 of figure 24 in Espressif's guidelines. No board material, and
    therefore no copper, lies beside or under the antenna.
  clearance: 15.0            # src: esp-hw-guide, "at least 15 mm ... in all directions"
  antenna_area: [18.0, 6.0]  # src: wroom
  what_the_enclosure_gives: >-
    No metal within 15 mm in the board plane: nearest are the encoder frame at
    15.3 mm and screw B at 24 mm. Plastic is closer than 15 mm: the top wall
    is 4 mm above the antenna, the fascia 9.5 mm in front. The wall the unit
    hangs on is 21 mm behind.

# Heights of the tall or awkward parts, with where each number came from.
heights:
  - {ref: C1, part: VZH471M1JTR-1616, height: 17.0, src: cap,
     note: "16.5 +/- 0.5. Base 17.0 x 17.0. Bottom side only."}
  - {ref: C1-alt, part: 63PX470MEFC12.5X20, height: 21.5, src: rubycon,
     note: "12.5 x 20 radial plus its length tolerance, taken as 1.5. Does not fit standing. Fits lying down, 12.5 high."}
  - {ref: K1, part: G5NB-1A-E, height: 15.3, src: relay,
     note: "20.5 x 7.2 x 15.3 maximum. Bottom side only."}
  - {ref: L1, part: SRN6045TA-470M, height: 4.5, src: inductor,
     note: "4.2 +/- 0.3. Top side, anywhere in T_GENERAL."}
  - {ref: J1-J4, part: KF2EDGR-3.81, height: 7.0, src: header,
     note: "9.2 deep, pin row 1.3 from the back, length P x 3.81 + 0.8"}
  - {ref: plugs, part: KF2EDGK-3.81, height: 11.6, src: plug,
     note: "11.1 thick, taken as starting 0.5 above the board; 15.6 long, 6.7 inserted"}
  - {ref: SW3, part: EC11J1525402, height: 24.5, src: encoder, note: "Shaft top"}
  - {ref: SW4 SW5, part: TS-1102S-C-M-B, height: 10.0, src: tact, note: "Code M"}
  - {ref: BT1, part: CR2032-BS-6-1, height: 5.5, src: cr2032, note: "31.3 x 16 over the pins"}
  - {ref: U4, part: ESP32-S3-WROOM-1, height: 3.25, src: wroom, note: "3.1 +/- 0.15"}
  - {ref: J5, part: TYPE-C-31-M-12, height: 3.26, src: usbc, note: "8.94 x 7.35 body"}
  - {ref: J6, part: SM04B-SRSS-TB, height: 2.95, src: jst, note: "4.25 deep; width 6.0 not read from the drawing"}
  - {ref: Q101-Q901, part: T410-600B-TR DPAK, height: 2.4, src: triac, note: "Dimension A maximum"}
  - {ref: D6 D102-D902, part: LTST-C190KGKT, height: 0.8, src: led, note: "\"Extra thin (0.80 mm)\""}

unconfirmed:
  - id: fpc_contact_side
    what: Which face of the display FPC carries the contacts
    assumed: >-
      The display side. The front view of the drawing shows the twelve
      fingers and the rear view shows a hatched 5 x 6.5 mm stiffener. Folded
      under the panel, the contacts then face the board, which is what the
      bottom-contact J7 needs.
    if_wrong: Fit the top-contact version of J7 on the same footprint. Nothing mechanical moves.
  - id: fpc_reach
    what: Whether the 20.7 +/- 0.5 mm tail reaches J7 in a C-fold
    assumed: >-
      Tail leaves the panel 1.3 mm below the glass, drops 8.7 mm to a slot
      1.0 mm above the board on a 4.35 mm radius (13.7 mm of length), 3.3 mm
      inserted, 3.7 mm straight. J7's mouth is 0.76 mm inside the panel edge.
    if_wrong: Move J7 along x. It is the only part that moves.
  - id: fpc_tail_offset
    what: Whether 15.28 mm is to the edge of the tail or its centre
    assumed: The edge. Scaling the drawing agrees within 0.1 mm.
    if_wrong: J7 moves 3.25 mm along y.
  - id: j7_body
    what: Body size and slot height of FPC-05F-12PH20
    assumed: 5.0 x 9.6 mm body, slot 1.0 mm above the board, 2.0 mm high
    if_wrong: The carrier cut-out is 9 x 23 mm, so there is room.
  - id: panel_tabs
    what: The eight 0.6 mm frame tabs marked on the panel drawing
    assumed: They stay within 0.4 mm of the outline
    if_wrong: Raise display_fit in enclosure/params.scad.
  - id: plug_height
    what: Height of the top of a mated KF2EDGK plug above the board
    assumed: 11.6 mm. The drawing gives 11.1 mm thickness but not its offset to the header.
    if_wrong: The wiring cover has 1.4 mm above that.
  - id: usb_mouth
    what: How far the USB-C shell overhangs the board edge
    assumed: 1.0 mm
    if_wrong: The opening is sized for the plug overmold, so up to 2 mm either way is fine.
  - id: usb_overmold
    what: Largest USB-C plug overmold
    assumed: 12.35 x 6.5 mm, from memory of the USB Type-C specification, not re-read
    if_wrong: Opening is 13 x 7.4 mm. A fatter plug will not go in.
  - id: sm04b_width
    what: Width of the SM04B-SRSS-TB body
    assumed: 6.0 mm
    if_wrong: Opening is 7.5 mm wide.
  - id: moc_fuse_height
    what: Heights of MOC3023SR2M and the 0154 fuse holder
    assumed: Under 9 mm. Not read from a drawing.
    if_wrong: Both are well under the limit for any plausible value.
  - id: insert
    what: Hole for the M3 heat-set insert
    assumed: 4.0 mm diameter for a 5.7 mm long insert
    if_wrong: insert_d and insert_depth in enclosure/params.scad.

