# What moved since revision 1 of this contract (commit 2f7e375). The hardware
# design's section 16.4 quotes revision 1 numbers.
changes:
  - "Board outline 114 x 100 becomes 114 x 110. The bottom edge and everything up to y = 45 keep their positions."
  - "Moved up by 10 mm in y: DS1, J7, SW3, SW4, SW5, U4, BT1, holes A and G, feet E and F, and every zone above y = 45."
  - "J7 is now at x = 60.44, y = 88.43, pad 1 at y = 85.68, pad 12 at y = 91.18. Its body is 5.12 x 10.4 mm. Its mouth stays at x = 63.0."
  - "Hole B moves from (70, 95) to (75, 106) and foot F from (70, 61) to (75, 70): 10 mm up with the rest, and 5 mm right so that a 2.4 inch panel fits later."
  - "BT1 reserved position moves from (93, 54) to (95, 64)."
  - "New fixed parts F4 at (15.0, 12.6) and F1 at (27.0, 12.6), in zone T_FUSEWELL."
  - "C1 is the through-hole Rubycon part, fixed at (21, 30) on the bottom side, lying down, pads at (36, 27.5) and (36, 32.5). No SMT on the bottom."
  - "K1 suggested position moves to (50, 22)."
  - "T_CARRIER is 5.0 mm, was 6.5, and now reaches x = 79.5."
  - "cover_inner_z is 12.5, was 13.0."
