# Maximum component height above each surface, per region. A region listed
# later overrides one listed earlier where they overlap. `max_height: 0` means
# no component. The parts in `parts` are exempt inside their own footprint.
zones:
  - {id: T_GENERAL, side: top, rect: [0, 0, 114, 110], max_height: 9.0,
     why: "Fascia inner surface at 10.5, less 1.5 for print tolerance"}
  - {id: T_CARRIER, side: top, rect: [0, 67.5, 79.5, 110], max_height: 5.0,
     why: "Display carrier deck and arms. Underside at 7.65 now, 6.3 with a 2.4 inch panel."}
  - {id: T_FPC, side: top, rect: [58, 76.5, 72, 99.5], max_height: 0,
     why: "The display FPC folds through here. J7 only."}
  - {id: T_BTN_BACK, side: top, rect: [11.5, 55, 32.5, 68], max_height: 7.0,
     why: "Flange of the button cap, underside at 8.0, moves 0.25"}
  - {id: T_BTN_HOME, side: top, rect: [37.5, 55, 58.5, 68], max_height: 7.0,
     why: "Flange of the button cap"}
  - {id: T_LIGHTPIPE, side: top, rect: [9.3, 39.3, 104.7, 44.7], max_height: 1.0,
     why: "Light pipes end at z = 1.5 over each LED; their rail runs the length"}
  - {id: T_FUSEWELL, side: top, rect: [8.0, 7.5, 34.0, 17.9], max_height: 0,
     why: "Fuse well. F1 and F4 only. Its walls come down to 0.3 above the board. Everything inside it can be touched with the wiring cover off."}
  - {id: T_ANTENNA, side: top, rect: [79, 95, 114, 110], max_height: 3.5,
     why: "Within 15 mm of the antenna: nothing tall, no metal body other than U4"}
  - {id: T_EDGE_LEFT, side: top, rect: [0, 0, 1.0, 110], max_height: 0,
     why: "Fascia lip overhangs the board edge from z = 0.6"}
  - {id: T_EDGE_RIGHT, side: top, rect: [113, 0, 114, 110], max_height: 0,
     why: "Fascia lip overhangs the board edge from z = 0.6"}
  - {id: B_GENERAL, side: bottom, rect: [0, 0, 114, 110], max_height: 17.0,
     why: "18.0 mm to the back wall. Only through-hole parts go here."}
  - {id: B_KEYHOLE_L, side: bottom, rect: [10.5, 80, 28.5, 104], max_height: 10.0,
     why: "Pocket for the wall screw head, top 11.3 below the board"}
  - {id: B_KEYHOLE_R, side: bottom, rect: [85.5, 80, 103.5, 104], max_height: 10.0,
     why: "Pocket for the wall screw head"}
  - {id: B_ANTENNA, side: bottom, rect: [79, 95, 114, 110], max_height: 3.5,
     why: "Within 15 mm of the antenna"}

antenna:
  module: U4
  rule: >-
    The module sits in the top-right corner with its 18 x 6 mm antenna area
    wholly beyond the top board edge, feed point towards the corner. That is
    position 3 of figure 24 in Espressif's guidelines. No board material, and
    therefore no copper, lies beside or under the antenna.
  clearance: 15.0            # src: esp-hw-guide, "at least 15 mm ... in all directions"
  antenna_area: [18.0, 6.0]  # src: wroom
  what_the_enclosure_gives: >-
    No metal within 15 mm in the board plane: nearest are the encoder frame at
    15.3 mm and screw B at 19.4 mm. Plastic is closer than 15 mm: the top wall
    is 4 mm above the antenna, the fascia 9.5 mm in front. The wall the unit
    hangs on is 22 mm behind.

# A larger panel later. Nothing on the board is laid out for it now. The four
# carrier points A, B, E, F and zone T_CARRIER already leave room, so the
# encoder, the buttons, the module and the holes would stay where they are.
display_options:
