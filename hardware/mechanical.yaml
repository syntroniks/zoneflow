    part: HS20HS072RX
    fitted: true
    active_area: [40.8, 30.6]
    outline: [51.8, 36.2]
    aa_to_edge_opposite_fpc: 2.64
    aa_to_long_edge: 2.8
    thickness: 2.05
    centre: [35.0, 88.0]
    fpc_root_y_from_origin: [7.3, 28.75]
    src: display
  - id: "2.4"
    part: HS24CG003-ARX
    fitted: false
    active_area: [48.96, 36.72]        # src: display24
    outline: [60.26, 42.72]            # src: display24, tolerance 0.1 on 42.72
    aa_to_edge_opposite_fpc: 2.8       # src: display24
    aa_to_long_edge: 3.0               # src: display24
    thickness: 3.4                     # src: display24, with its touch panel
    centre: [37.18, 89.6]              # active-area centre that clears A, B, E, F and the buttons
    fpc_root_y_from_origin: [9.0, 34.0]   # scaled from the drawing
    src: display24
    what_changes: >-
      J7 becomes a 16-way connector at about x = 67, y = 90, with a different
      pin order and four touch pins. The parts in x 58 to 78, y 70 to 100
      move. The panel is a touch type with a 12 o'clock viewing direction,
      not IPS, and is 3.4 mm thick, so the carrier deck drops to 7.5 mm above
      the board. Its tail is 17.4 mm long, 3.3 mm shorter. The fascia and
      carrier are rebuilt with `panel = "2.4"`; no other printed part changes.

