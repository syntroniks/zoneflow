# ZoneFlow rev A design netlist. Paper design: no board exists.
#
# One entry per component: reference, part (value, package, LCSC number),
# block, build variant and the net on every pin. Pin keys carry the pin number
# where the datasheet was read for it, otherwise the pin name. This file and
# the tables in docs/design/hardware-design.md describe the same circuit. This
# file is the source: tools/designsync writes the tables from it and checks
# the BOM and the pin map against it. Run "make -C hardware design-check".
#
# variant: all = fitted on both builds, 8 = fitted on the 8-zone build only,
# dnf = footprint on the board, no part fitted on either build.
# NC = leave unconnected.

