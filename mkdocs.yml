site_name: ZoneFlow
site_description: Open-source 24 VAC irrigation controller. Designed on paper; not yet built or tested.
site_url: https://syntroniks.github.io/zoneflow/
repo_url: https://github.com/syntroniks/zoneflow
repo_name: syntroniks/zoneflow
edit_uri: edit/main/docs/
copyright: Documentation licensed CC-BY-4.0. Hardware CERN-OHL-P-2.0. Firmware Apache-2.0.

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search
  - swagger-ui-tag

# Publish generated hardware and enclosure files (schematic, BOMs, drilling
# template) with the site, and render the BOM table from its CSV.
hooks:
  - tools/mkdocs_hooks/hardware_outputs.py
  - tools/mkdocs_hooks/bom_table.py
  - tools/mkdocs_hooks/demo.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Try it in your browser: try-it.md
  - Status and roadmap: status.md
  - Safety: safety.md
  - Getting started:
      - getting-started/index.md
      - What you need: getting-started/what-you-need.md
      - Mounting: getting-started/mounting.md
      - Wiring: getting-started/wiring.md
      - Installing firmware: firmware/web-installer.md
      - First power-up: getting-started/first-power-up.md
      - Joining your network: getting-started/provisioning.md
      - First schedule: getting-started/first-schedule.md
      - Testing each zone: getting-started/testing-zones.md
  - User guide:
      - Choosing a firmware: firmware/index.md
      - The display: guide/display.md
      - The web interface: firmware/standalone.md
      - MQTT and Home Assistant: firmware/mqtt.md
      - ESPHome: firmware/esphome.md
      - Updating firmware: firmware/releases.md
      - Backup and restore: guide/backup-restore.md
      - Factory reset: guide/factory-reset.md
      - Security for home users: guide/security.md
      - REST API reference: firmware/api.md
  - Troubleshooting: troubleshooting.md
  - Hardware reference:
      - hardware/index.md
      - Specifications: hardware/specifications.md
      - How the fail-safe works: hardware/fail-safe.md
      - Schematic: hardware/schematic.md
      - Bill of materials: hardware/bom.md
      - The 4-zone build: hardware/four-zone.md
      - Ordering boards: hardware/ordering.md
      - What a controller costs: hardware/cost.md
      - Design notes: hardware/design-notes.md
  - Enclosure:
      - enclosure/index.md
      - Printing: enclosure/printing.md
      - Assembly: enclosure/assembly.md
  - FAQ: faq.md
  - Glossary: glossary.md
  - Contributing: contributing.md
  - Design documents:
      - design/index.md
      - System specification: design/system-spec.md
      - Prior-art survey: design/prior-art.md
      - Hardware design: design/hardware-design.md
      - Hardware review A1: design/hardware-review-a1.md
      - Hardware review A2: design/hardware-review-a2.md
      - Hardware answers A2: design/hardware-answers-a2.md
      - Hardware toolchain: design/hardware-toolchain.md
      - Mechanical design: design/mechanical.md
      - Firmware architecture: design/firmware-architecture.md
      - Firmware security: design/firmware-security.md
      - Display interface: design/display-ui.md
      - Web UI contract: firmware/web-ui-contract.md
