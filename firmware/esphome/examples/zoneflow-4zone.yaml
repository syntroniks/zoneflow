# CI and local build of the 4-zone package from this checkout:
#   uv run esphome compile examples/zoneflow-4zone.yaml
substitutions:
  name: zoneflow-4zone
  friendly_name: ZoneFlow 4
  zone_1_name: Front lawn
  zone_2_name: Back lawn
  zone_3_name: Vegetables
  zone_4_name: Hedge

packages:
  zoneflow: !include ../zoneflow/package-4.yaml

external_components:
  - source: ../components
    components: [zoneflow, zoneflow_schedule]
