# The ESPHome sprinkler controller on 8 ZoneFlow outputs. The master valve is
# sequenced by the zoneflow component (it opens 1 s before the first zone and
# closes 2 s after the last), not by sprinkler's pump options, because the
# output layer must also keep the 100 ms stagger and the master lockout.
sprinkler:
  - id: zf_sprinkler
    main_switch: All zones
    auto_advance_switch: Auto advance
    standby_switch: Standby
    queue_enable_switch: Queue enabled
    multiplier_number:
      name: Seasonal adjustment
      initial_value: 1.0
      min_value: 0.0
      max_value: 2.5
      step: 0.05
    repeat_number:
      name: Repeat cycles
      initial_value: 0
      max_value: 3
    valves:
      - valve_switch: ${zone_1_name} run
        valve_switch_id: zf_zone_1
        enable_switch:
          id: zf_zone_1_enabled
          name: ${zone_1_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_1_duration
          name: ${zone_1_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_2_name} run
        valve_switch_id: zf_zone_2
        enable_switch:
          id: zf_zone_2_enabled
          name: ${zone_2_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_2_duration
          name: ${zone_2_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_3_name} run
        valve_switch_id: zf_zone_3
        enable_switch:
          id: zf_zone_3_enabled
          name: ${zone_3_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_3_duration
          name: ${zone_3_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_4_name} run
        valve_switch_id: zf_zone_4
        enable_switch:
          id: zf_zone_4_enabled
          name: ${zone_4_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_4_duration
          name: ${zone_4_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_5_name} run
        valve_switch_id: zf_zone_5
        enable_switch:
          id: zf_zone_5_enabled
          name: ${zone_5_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_5_duration
          name: ${zone_5_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_6_name} run
        valve_switch_id: zf_zone_6
        enable_switch:
          id: zf_zone_6_enabled
          name: ${zone_6_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_6_duration
          name: ${zone_6_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_7_name} run
        valve_switch_id: zf_zone_7
        enable_switch:
          id: zf_zone_7_enabled
          name: ${zone_7_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_7_duration
          name: ${zone_7_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}
      - valve_switch: ${zone_8_name} run
        valve_switch_id: zf_zone_8
        enable_switch:
          id: zf_zone_8_enabled
          name: ${zone_8_name} enabled
          restore_mode: RESTORE_DEFAULT_ON
        run_duration_number:
          id: zf_zone_8_duration
          name: ${zone_8_name} run duration
          unit_of_measurement: min
          initial_value: 10
          min_value: 1
          max_value: ${max_run_minutes}

# Zone names for the log and the display (merged into the zoneflow block).
zoneflow:
  zone_names:
    - ${zone_1_name}
    - ${zone_2_name}
    - ${zone_3_name}
    - ${zone_4_name}
    - ${zone_5_name}
    - ${zone_6_name}
    - ${zone_7_name}
    - ${zone_8_name}
