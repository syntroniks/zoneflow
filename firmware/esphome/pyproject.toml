[project]
name = "zoneflow-esphome"
version = "0.0.0"
description = "Build environment for the ZoneFlow ESPHome package. Not a published package."
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned: the external components use ESPHome's C++ and Python APIs, which
    # change between releases. Raise it deliberately and rerun every check.
    "esphome==2026.10.2",
]

[dependency-groups]
dev = ["ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
