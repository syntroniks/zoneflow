name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --locked

      - name: Vendored ESP Web Tools is the pinned one
        run: python3 tools/ewt/vendor.py check

      # The browser demo (docs/try-it.md): the firmware as WebAssembly, the
      # web interface and the page around them. The script smoke-tests the
      # module under Node before it assembles the demo. The site build below
      # copies the result to demo/.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firmware/zoneflow-fw/web/package-lock.json

      - name: Cache the demo's Emscripten and sources
        uses: actions/cache@v4
        with:
          path: |
            firmware/zoneflow-fw/sim/.cache
            firmware/zoneflow-fw/sim/build-web/_deps
          key: demo-deps-${{ hashFiles('firmware/zoneflow-fw/sim/CMakeLists.txt', 'firmware/zoneflow-fw/sim/web/build.sh') }}

      - name: Build the browser demo
        run: firmware/zoneflow-fw/sim/web/build.sh --emsdk

      # docs/hardware/cost.md: its tables are written by tools/cost from dated
      # data files. Test the arithmetic, then check the page matches the data.
      - name: Cost estimate tests
        working-directory: tools/cost
        run: |
          uv run --locked ruff check .
          uv run --locked pytest -q
          uv run --locked zfcost render ../../docs/hardware/cost.md --check

      # docs/hardware/review/: the pre-order review walkthrough. Its steps may name only parts and
      # nets that are on the committed board, and its pictures must have been drawn from that board.
      # This job has no KiCad: the tests that draw are skipped here and run in the board job of the
      # hardware workflow. The page logic is tested under Node.
      - name: Review walkthrough tests
        working-directory: tools/reviewwalk
        run: |
          uv run --locked ruff check .
          uv run --locked pytest -q

      # The build fails too if the walkthrough and the board disagree.
      - name: Build site
        run: uv run mkdocs build --strict

      # mkdocs --strict checks Markdown links between pages. This also checks
      # raw HTML links and images, generated files and anchors in the built site.
      - name: Check internal links
        run: python3 tools/docs/check_links.py site

      # WebSerial cannot download GitHub release assets (other origin, no CORS), so the newest
      # release is copied into the site. Its checksums are checked first. No release yet: skip,
      # and the installer page says so.
      - name: Add the newest firmware release to the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$tag" ]; then
            echo "No release yet; the installer page will say so."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/release"
          gh release download "$tag" --dir "$RUNNER_TEMP/release"
          uv run --project tools/zfrelease --locked zfrelease stage-site "$RUNNER_TEMP/release" site

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
