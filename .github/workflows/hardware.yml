name: hardware

on:
  pull_request:
    paths:
      - "hardware/**"
      - "docs/design/hardware-design.md"
      - "tools/designsync/**"
      - ".github/workflows/hardware.yml"
  push:
    branches: [main]
    paths:
      - "hardware/**"
      - "docs/design/hardware-design.md"
      - "tools/designsync/**"
      - ".github/workflows/hardware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  design-check:
    name: design consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      # Netlist, design document tables, BOM and pin map must agree.
      - name: Check the rev A design files against the netlist
        run: make -C hardware design-check
