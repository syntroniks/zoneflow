name: firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "hardware/pinmap.yaml"
      - "docs/firmware/openapi.json"
      - "docs/design/display-ui/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "hardware/pinmap.yaml"
      - "docs/firmware/openapi.json"
      - "docs/design/display-ui/**"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The board header is generated from hardware/pinmap.yaml at configure
      # time (tools/gen_board_header.py, PyYAML through uv).
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Build and run (ASan + UBSan)
        run: firmware/zoneflow-fw/test/host/run.sh --output-junit junit.xml
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-report
          path: firmware/zoneflow-fw/test/host/build/junit.xml
          if-no-files-found: ignore

  display-sim:
    name: Display simulator and screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Cache LVGL and cJSON sources
        uses: actions/cache@v4
        with:
          path: firmware/zoneflow-fw/sim/build/_deps
          key: sim-deps-${{ hashFiles('firmware/zoneflow-fw/sim/CMakeLists.txt') }}
      - name: Build headless and draw every scene
        env:
          ZF_SIM_HEADLESS: "1"
        run: |
          firmware/zoneflow-fw/sim/run.sh --screenshots "$RUNNER_TEMP/screenshots"
          firmware/zoneflow-fw/sim/run.sh --report
      # Names only. Pixels are not compared: a reviewer looks at the pictures.
      - name: Committed pictures match the scene list
        run: |
          diff <(ls "$RUNNER_TEMP/screenshots") <(ls docs/design/display-ui) || {
            echo "::error::docs/design/display-ui is out of step with sim/scenes.cpp. Run firmware/zoneflow-fw/sim/run.sh --screenshots docs/design/display-ui and commit the result."
            exit 1
          }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-screenshots-${{ github.sha }}
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: error

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting (clang-format 23.1.4 from PyPI)
        working-directory: firmware/zoneflow-fw
        run: |
          git ls-files '*.cpp' '*.hpp' | xargs pipx run --spec clang-format==23.1.4 clang-format --dry-run --Werror

  build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The web UI goes into www/, which idf.py packs into build/www.bin.
      # Without it the firmware still builds and serves its built-in page.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firmware/zoneflow-fw/web/package-lock.json
      - name: Build the web UI into www/
        working-directory: firmware/zoneflow-fw/web
        run: npm ci && npm run build
      - name: idf.py build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32s3
          path: firmware/zoneflow-fw
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: zoneflow-fw-esp32s3-${{ github.sha }}
          path: |
            firmware/zoneflow-fw/build/zoneflow-fw.bin
            firmware/zoneflow-fw/build/zoneflow-fw.elf
            firmware/zoneflow-fw/build/zoneflow-fw.map
            firmware/zoneflow-fw/build/bootloader/bootloader.bin
            firmware/zoneflow-fw/build/partition_table/partition-table.bin
            firmware/zoneflow-fw/build/ota_data_initial.bin
            firmware/zoneflow-fw/build/flasher_args.json
            firmware/zoneflow-fw/build/flash_args
            firmware/zoneflow-fw/build/www.bin
          if-no-files-found: error
