name: web-ui

on:
  push:
    branches: [main]
    paths:
      - "firmware/zoneflow-fw/web/**"
      - "firmware/zoneflow-fw/test/vectors/**"
      - "docs/firmware/openapi.json"
      - ".github/workflows/webui.yml"
  pull_request:
    paths:
      - "firmware/zoneflow-fw/web/**"
      - "firmware/zoneflow-fw/test/vectors/**"
      - "docs/firmware/openapi.json"
      - ".github/workflows/webui.yml"

permissions:
  contents: read

concurrency:
  group: webui-${{ github.ref }}
  # A new push to a pull request replaces its run. A run on main is left to finish, so that every
  # commit on main has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: firmware/zoneflow-fw/web

jobs:
  test:
    name: Build, unit and end-to-end tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: firmware/zoneflow-fw/web/package-lock.json
      - name: Install
        run: npm ci
      - name: API types match docs/firmware/openapi.json
        run: npm run check:api
      - name: Schedule vectors match the preview code
        run: node scripts/gen-vectors.ts --check
      - name: Unit tests
        run: npm test
      - name: Build, pack and check the size budget
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (phone, 320 px, desktop) against the mock controller
        run: npx playwright test --project=phone --project=phone-320 --project=desktop
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: firmware/zoneflow-fw/web/playwright-report
          if-no-files-found: ignore
      - name: Upload www
        uses: actions/upload-artifact@v4
        with:
          name: zoneflow-www-${{ github.sha }}
          path: firmware/zoneflow-fw/www
          if-no-files-found: error
